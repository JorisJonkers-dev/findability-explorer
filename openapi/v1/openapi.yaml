openapi: 3.1.0
info:
  title: findability-explorer API
  version: 1.0.0
  description: >-
    The Findability Explorer: the terminology map of metal conveyor belts (who calls which belt
    what, in which language) and on-demand analyses of a website's keywords. The Go server (ogen)
    and the Vue client (@hey-api/openapi-ts) are both generated from this document. Change it
    first; `task gen` regenerates both sides and `task gen:check` fails when either is stale.
  contact:
    name: Joris Jonkers
    url: https://github.com/JorisJonkers-dev
  license:
    name: Proprietary
    url: https://github.com/JorisJonkers-dev/findability-explorer/blob/main/LICENSE
servers:
  - url: https://digital-strategy.jorisjonkers.dev
    description: Production. The SPA and the API share one origin.
    x-internal: false
security:
  - sessionCookie: []
tags:
  - name: account
    description: The signed-in account.
  - name: admin
    description: >-
      Settings only an administrator (auth-api's ROLE_ADMIN) may read or change: the language-model
      credentials and the model product matching uses.
  - name: terminology
    description: The terminology map, built from competitors' and Tribelt's own websites.
  - name: competitors
    description: >-
      The companies Tribelt competes with: the ones the desk research studied, and every one a user
      added or scanned since.
  - name: analyses
    description: On-demand keyword analyses of one website.
  - name: prompt-test
    description: >-
      The Prompt test: whether AI assistants name Tribelt when a buyer asks, measured by Prompt
      runs of a fixed, versioned prompt set on the cheapest model of each large provider.
  - name: insight
    description: >-
      How Tribelt stands against its competitors, its belt families against the field, and the
      plan, all computed from the newest Prompt runs, scans and research.
paths:
  /api/v1/ai-search:
    get:
      operationId: getAiSearchSummary
      summary: Get the AI search summary
      description: >-
        Tribelt's share of AI answers over the newest Prompt runs, oldest first, against the
        competitors the newest run names most; which crawlers tribelt.nl's newest scan lets in,
        with the lab behind each and what it feeds; the competitors that keep crawlers out; and
        Tribelt among the best-prepared competitors by readiness checks passed out of five.
      tags: [insight]
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSearchSummary"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/plan:
    get:
      operationId: getPlan
      summary: Get the plan
      description: >-
        The plan's improvements in order, each with whether it is done, the measure it moves and
        the competitor to look at (the leader of that measure). An improvement a scan of
        tribelt.nl can check is done by the latest scan; the others are ticked off by hand. Also
        the numbers to watch against their targets, and the competitors to keep an eye on.
      tags: [insight]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/plan/improvements/{improvementId}:
    put:
      operationId: tickImprovement
      summary: Tick an improvement off, or undo the tick
      description: >-
        Administrators only. Marks an improvement no scan can check as done, recording who and
        when, or as not done again. 404 for an unknown improvement; 422 for one a scan of
        tribelt.nl checks.
      tags: [admin]
      parameters:
        - name: improvementId
          in: path
          required: true
          description: The improvement's id.
          schema:
            type: string
            maxLength: 60
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      requestBody:
        required: true
        description: Whether it is done.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImprovementTick"
            example:
              done: true
      responses:
        "200":
          description: The plan, with the tick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/plan/targets:
    put:
      operationId: setPlanTargets
      summary: Set the plan's targets
      description: >-
        Administrators only. Sets the targets given; the rest keep theirs. Shares are fractions
        from 0 to 1, readiness checks 0 to 5 in halves, terms and citations whole numbers. 422
        when one is out of range, and nothing is stored.
      tags: [admin]
      requestBody:
        required: true
        description: The targets to set.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanTargetsChange"
            example:
              targets:
                - target: termsUsed
                  value: 40
      responses:
        "200":
          description: The plan, with the targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/products:
    get:
      operationId: getProducts
      summary: Get Tribelt's belt families against the field
      description: >-
        For each of Tribelt's belt families: Tribelt's own names for it, the competitors that sell
        it with their names for it, the terminology map's terms for it with how many companies use
        each and whether Tribelt's site does, and how the newest Prompt run's answers about it
        treat Tribelt, per scope and by who they name. The standouts say which family the most
        competitors sell, whose terms Tribelt uses least, and whose answers name Tribelt most.
      tags: [insight]
      responses:
        "200":
          description: The families.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsOverview"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/standings:
    get:
      operationId: getStandings
      summary: Get how Tribelt stands against its competitors
      description: >-
        Compares Tribelt with its competitors on each measure, from the newest Prompt run and each
        company's newest scan: Tribelt's value, the median over the competitors with data, and the
        leader, the competitor with the best value (a tie goes to the name first alphabetically).
        Tribelt, its group companies and the mirror are never the median or the leader. Shares
        are fractions from 0 to 1.
      tags: [insight]
      responses:
        "200":
          description: The standings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standings"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/overview:
    get:
      operationId: getOverview
      summary: Get the home page's figures
      description: >-
        The figures the home page shows, counted on the server so the page fetches a few numbers.
        The terminology map's terms, in total and per language (American English counts as
        English), and how many of them Tribelt's own site uses. The competitors the desk research
        found, and how many of them offer each of Tribelt's belt families. From the newest Prompt
        run with answers that count, how many answers there are, and how many name Tribelt and
        each of the four competitors named most.
      tags: [insight]
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/terms:
    get:
      operationId: searchTerms
      summary: Search the terminology map
      description: >-
        Returns the terms that match the query and every filter, best match first, with the count
        of matching terms per language, tier and belt family. The query ignores case, accents and
        the difference between ß and ss, and matches the term and its users.
      tags: [terminology]
      parameters:
        - name: q
          in: query
          required: false
          description: Free text to look for in the term and its users.
          schema:
            type: string
            maxLength: 100
        - name: language
          in: query
          required: false
          description: Only terms in this language.
          schema:
            $ref: "#/components/schemas/Language"
        - name: tier
          in: query
          required: false
          description: Only terms of this intent tier.
          schema:
            $ref: "#/components/schemas/IntentTier"
        - name: family
          in: query
          required: false
          description: Only terms for this belt family.
          schema:
            $ref: "#/components/schemas/BeltFamily"
        - name: user
          in: query
          required: false
          description: Only terms used by a company whose name contains this text.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: How many terms to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
            default: 50
      responses:
        "200":
          description: The matching terms and the facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermSearch"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/competitors:
    get:
      operationId: listCompetitors
      summary: List every known company
      description: >-
        Returns every company the research studied and every company added since, with its names
        for each belt family and how often its website was scanned.
      tags: [competitors]
      responses:
        "200":
          description: >-
            The companies: researched competitors by name, then added ones by name, then Tribelt's
            own group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addCompetitor
      summary: Add a company
      description: >-
        Administrators only. Adds a company by its name and website. A website whose host a known
        company already has is refused with 409, naming that company.
      tags: [competitors]
      requestBody:
        required: true
        description: The company to add.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCompetitor"
            example:
              name: Example Belts
              url: https://www.example-belts.com
      responses:
        "201":
          description: The added company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitors/batch:
    post:
      operationId: addCompetitors
      summary: Add several competitors at once
      description: >-
        Administrators only. Adds the companies in order and says per item what became of it:
        added; skipped as a duplicate when a known company, or an earlier item, has its website's
        host or its name; or rejected without a valid name or website. An item from a competitor
        candidate records the candidate as added. With `scan`, the added companies are scanned
        straight away. 422 for no item or more than 100.
      tags: [admin]
      requestBody:
        required: true
        description: The companies to add.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorBatchRequest"
            example:
              items:
                - name: Intralox
                  url: https://www.intralox.com
                  candidateId: 3a7bd3e2360a9f01
              scan: true
      responses:
        "200":
          description: What became of each item, and how many scans started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorBatch"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/competitors/{competitorId}:
    get:
      operationId: getCompetitor
      summary: Get one company with its scans
      description: Returns the company and its scans, newest first, each with its number.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
      responses:
        "200":
          description: The company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCompetitor
      summary: Change a company's name or website, archive it, or keep it
      description: >-
        Administrators only. Changes the name or website of a company, archives or restores it, or
        records that an administrator keeps it on the list. An archived company leaves the list and
        the re-scans and keeps its scans. A restored or kept company is never archived by Claude
        Haiku. A researched company keeps the research's record; the change is stored beside it. A
        website whose host another company has is refused with 409.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
      requestBody:
        required: true
        description: The fields to change.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorUpdate"
            example:
              name: Example Belts
              url: https://www.example-belts.com
      responses:
        "200":
          description: The company after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCompetitor
      summary: Remove a company
      description: >-
        Administrators only. An added company is deleted with every scan of it; updateCompetitor
        archives one and keeps its scans instead. A researched company is the desk research's
        record and is archived: it leaves the list and the re-scans, its scans stay, and
        updateCompetitor restores it. Refused with 409 while a scan of the company is queued or
        running.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
      responses:
        "204":
          description: Deleted or archived.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/competitors/{competitorId}/profile:
    get:
      operationId: getCompetitorProfile
      summary: Get a company's search terms from its latest finished scan
      description: >-
        Returns the search terms of the company's latest finished scan, grouped by Tribelt belt
        family, with broad and specification terms apart, and for each term the scan it first
        appeared in. A company without a finished scan has no scan and no groups.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorProfile"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/competitors/{competitorId}/scans/compare:
    get:
      operationId: compareScans
      summary: Compare two scans of a company
      description: >-
        Returns the search terms one finished scan of the company found and the other did not,
        and the ones whose score or page count moved beyond a threshold, per belt family. Without
        `from` and `to` it compares the latest two finished scans. 422 when the company has fewer
        than two finished scans or a scan named is not a finished scan of it.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
        - name: from
          in: query
          required: false
          description: The older scan's id; default the second newest finished scan.
          schema:
            type: string
            format: uuid
            maxLength: 36
        - name: to
          in: query
          required: false
          description: The newer scan's id; default the newest finished scan.
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanComparison"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/ai-readiness:
    get:
      operationId: getAiReadiness
      summary: Get every company's AI readiness
      description: >-
        Returns every company that is not archived with the AI readiness its newest scan recorded:
        Tribelt on top as the baseline, the mirror of tribelt.nl below it as the target, then
        Tribelt's group companies, then the competitors, each band by name. A company no scan
        checked yet has no readiness.
      tags: [competitors]
      responses:
        "200":
          description: The table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReadinessTable"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/readiness-checks:
    post:
      operationId: startReadinessCheck
      summary: Check every scanned company's AI readiness again
      description: >-
        Administrators only. In the background, reads the AI readiness files of each company's
        newest scan's site again (robots.txt, the sitemaps, llms.txt, llms-full.txt, the home page
        and its Markdown twin) and records what they say on that scan, dated. It crawls no pages
        and asks no language model, so it costs nothing. A company whose scan is still queued or
        running is left out. Returns the check's state; running already is no error.
      tags: [admin]
      responses:
        "202":
          description: The check is under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessCheckState"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/rescans:
    post:
      operationId: startRescans
      summary: Re-scan companies
      description: >-
        Administrators only. Queues one scan for each named company with a website, or with
        `all`, for every company that is not archived, has a website and has data: the desk
        research studied it, or it was scanned before. A company whose site turned its last scan
        away (`blocked`) is scanned too: its pages stay closed, but the scan records its AI
        readiness. A company whose scan is still queued or running is skipped, and so is one
        without a website. The scans run a few at a time, each site politely.
      tags: [admin]
      requestBody:
        required: true
        description: Which companies to scan again.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescanRequest"
            example:
              all: true
              maxPages: 60
      responses:
        "202":
          description: The queued scans and the skipped companies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescanBatch"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates:
    get:
      operationId: listTermCandidates
      summary: List the search terms scans found outside the map
      description: >-
        Administrators only. Every phrase a finished scan found that the terminology map did not
        hold in its language, across companies, with its evidence and the classifier's suggestion;
        filtered by review status, most companies and highest score first. The same phrase in
        another language is another candidate.
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          description: Only candidates with this status.
          schema:
            $ref: "#/components/schemas/TermCandidateStatus"
      responses:
        "200":
          description: The candidates and how many have each status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCandidateList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates/review:
    post:
      operationId: startTermReview
      summary: Let the language model review the waiting candidates now
      description: >-
        Administrators only. Claude Haiku, on an Anthropic key, reviews every waiting candidate it
        has not reviewed yet, in the background, as it does every ten minutes. It decides the phrases it is
        sure about, as the language model, and leaves the rest waiting with its suggestion. Returns
        the review's state.
      tags: [admin]
      responses:
        "202":
          description: The review is under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermReviewState"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates/{candidateId}/accept:
    post:
      operationId: acceptTermCandidate
      summary: Add a candidate to the terminology map
      description: >-
        Administrators only. Adds the term, as the admin wrote it, to the terminology map, where
        search, the facets and the next scans find it. 409 when the candidate was decided already
        or the map has the term in that language.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      requestBody:
        required: true
        description: The term as it joins the map.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermAcceptance"
            example:
              term: spiral freezer belt
              language: en
              family: tri_flex_turn_curve
              tier: application
              usedBy: [Twentebelt]
      responses:
        "200":
          description: The candidate, accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCandidate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates/{candidateId}/reject:
    post:
      operationId: rejectTermCandidate
      summary: Reject a candidate
      description: >-
        Administrators only. Marks the candidate rejected; it stays rejected until the decision is
        undone. 409 when it was decided already.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: The candidate, rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCandidate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates/{candidateId}/decision:
    delete:
      operationId: undoTermDecision
      summary: Undo the decision on a candidate
      description: >-
        Administrators only. Puts the candidate back in the queue; an accepted term leaves the
        terminology map again. 409 when the candidate is pending.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: The candidate, pending again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCandidate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/analyses:
    get:
      operationId: listAnalyses
      summary: List recent analyses
      description: Returns at most `limit` analyses, newest first, without their results.
      tags: [analyses]
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            How many analyses to return; up to 300, so a re-scan of every company can be followed
            in one list.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
            default: 20
      responses:
        "200":
          description: The analyses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisList"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startAnalysis
      summary: Start an analysis of a website
      description: >-
        Administrators only. Queues a crawl of the site behind `url`: at most `maxPages` pages on
        the same site, product and application pages first, following robots.txt and the site's
        sitemaps and language versions. The analysis runs in the background; poll it until its
        status is done or failed. 409 while a scan of the same company is queued or running. There
        is no limit on how many scans an administrator starts: each waits its turn.
      tags: [analyses]
      requestBody:
        required: true
        description: The website to analyse.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAnalysis"
            example:
              url: https://www.twentebelt.com
              maxPages: 60
      responses:
        "202":
          description: The queued analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/analyses/{analysisId}:
    get:
      operationId: getAnalysis
      summary: Get one analysis with its results
      description: Returns the analysis, its progress, and every result found so far.
      tags: [analyses]
      parameters:
        - name: analysisId
          in: path
          required: true
          description: The analysis's id.
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/analyses/{analysisId}/readiness-files:
    get:
      operationId: getReadinessFiles
      summary: Get the raw files a scan read its AI readiness from
      description: >-
        Returns the robots.txt, llms.txt and llms-full.txt the site served to the scan, each
        capped at 100 KB, to check the classification against. They are public on the site, so
        every signed-in account reads them. 404 when the scan recorded no AI readiness.
      tags: [analyses]
      parameters:
        - name: analysisId
          in: path
          required: true
          description: The analysis's id.
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: The files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessFiles"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/prompt-test:
    get:
      operationId: getPromptTestResults
      summary: Get the Prompt test's results
      description: >-
        Returns the latest Prompt runs, newest first, each with its progress and its answers
        counted per provider, scope, belt family and mode (AI share of voice is named / answers,
        citation share cited / answers); how often the answers of the newest run with any name
        each company on the list; and the claims about Tribelt the answers got wrong, newest first.
      tags: [prompt-test]
      responses:
        "200":
          description: The results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTestResults"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/prompt-runs/{runId}/answers:
    get:
      operationId: listPromptAnswers
      summary: List a Prompt run's answers
      description: >-
        Returns a run's answers in full, each with how the extractor read it, optionally only one
        provider's, scope's, belt family's or mode's.
      tags: [prompt-test]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: provider
          in: query
          required: false
          description: Only this provider's answers.
          schema:
            type: string
            maxLength: 40
            pattern: "^[a-z0-9][a-z0-9-]*$"
        - name: scope
          in: query
          required: false
          description: Only this scope's answers.
          schema:
            $ref: "#/components/schemas/PromptScope"
        - name: family
          in: query
          required: false
          description: Only this belt family's answers.
          schema:
            $ref: "#/components/schemas/PromptFamily"
        - name: mode
          in: query
          required: false
          description: Only answers of this mode.
          schema:
            $ref: "#/components/schemas/PromptMode"
      responses:
        "200":
          description: The answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptAnswerList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/prompt-runs:
    post:
      operationId: startPromptRun
      summary: Start a Prompt run now
      description: >-
        Administrators only. Starts a Prompt run: every prompt of the prompt set, asked of the
        cheapest model of each large provider, from its own knowledge and with web search, each
        answer read by the extractor. It runs in the background within the month's budget. 409
        while a run is running; 422 without an OpenRouter key or a model to ask.
      tags: [admin]
      responses:
        "202":
          description: The run, started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRun"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/prompt-runs/{runId}/retry:
    post:
      operationId: retryPromptRun
      summary: Ask a Prompt run's failed answers again
      description: >-
        Administrators only. Asks a finished run's failed and missing answers again, or only the
        one question of one provider and mode named, in the same run: with the run's prompt set
        and models, each new answer replacing the failed one, what the failed try cost still
        counted. It runs in the background and stops at the month's budget like any run. 404 for
        a run nobody knows; 409 while a run is running or once the month's budget is spent; 422
        when nothing is left to ask, the run asked an earlier set of questions, or no OpenRouter
        key is chosen.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        description: Every failed answer when empty, or the one question to ask again.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRetryRequest"
            example:
              promptId: eyelink-application-twente
              provider: openai
              mode: web
      responses:
        "202":
          description: The run, running again, with how many answers it asks and what they should cost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptRetry"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/prompt-test:
    get:
      operationId: getPromptTestSettings
      summary: Get the Prompt test's settings
      description: >-
        Administrators only. Returns the OpenRouter key Prompt runs use, the providers, the
        monthly budget and this month's spend, the schedule, the fact sheet and the prompt set.
      tags: [admin]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTestSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePromptTestSettings
      summary: Change the Prompt test's settings
      description: >-
        Administrators only. Changes the key, the providers, the monthly budget, the schedule or
        the fact sheet. A new schedule counts from now; a new fact sheet is a new version. 422 for
        a key that is no readable OpenRouter key or a value that breaks a rule.
      tags: [admin]
      requestBody:
        required: true
        description: The settings to change.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptTestSettingsChange"
            example:
              monthlyBudgetUsd: 10
              cadence: monthly
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTestSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitor-candidates:
    get:
      operationId: listCompetitorCandidates
      summary: List the competitor candidates
      description: >-
        Administrators only. Every company the Prompt runs' answers name that is not on the
        company list, with how often and by which providers' models, the addresses given and its
        websites; names on one website, or merged, are one company. Filtered by status, most
        answers first.
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          description: Only candidates with this status.
          schema:
            $ref: "#/components/schemas/CompetitorCandidateStatus"
      responses:
        "200":
          description: The candidates and how many have each status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorCandidateList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitor-candidates/review:
    post:
      operationId: startCandidateReview
      summary: Let Claude Haiku review the competitor candidates
      description: >-
        Administrators only. In the background, Claude Haiku on an Anthropic key merges the waiting
        candidates that are one company, or a company on the list, and then checks each waiting
        company against Tribelt's target market, from what the answers say of it and its home page.
        A company it is sure competes, with a website, joins the competitor list; one it is sure
        does not is dismissed; the rest wait for a person. Its decisions are by `language model` and
        can be undone. Returns the review's state; running already is no error.
      tags: [admin]
      responses:
        "202":
          description: The review is under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateReviewState"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitor-checks:
    get:
      operationId: listCompetitorChecks
      summary: List Claude Haiku's checks of the companies on the competitor list
      description: >-
        Administrators only. Claude Haiku's check of each competitor on the list against Tribelt's
        target market, as for a candidate. A check made before the current version of the check is
        left out for a company still on the list and not kept, since the next check makes it again.
        With how many companies wait for a check, and whether a check runs.
      tags: [admin]
      responses:
        "200":
          description: The checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorCheckList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startCompetitorCheck
      summary: Let Claude Haiku check the companies on the competitor list
      description: >-
        Administrators only. In the background, Claude Haiku on an Anthropic key checks each
        competitor on the list that is not archived, that no administrator kept, and that it has
        not checked with the current version of the check, against Tribelt's target market, from
        its names, its website, its home page and what the answers say of it. A company it is sure
        does not compete is archived by `language model`; an unsure one stays on the list for an
        administrator; Tribelt, the mirror and group companies are never checked. Returns the
        check's state; running already is no error.
      tags: [admin]
      responses:
        "202":
          description: The check is under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateReviewState"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitor-candidates/decisions:
    post:
      operationId: decideCompetitorCandidates
      summary: Add or dismiss several competitor candidates at once
      description: >-
        Administrators only. Adds each candidate to the competitor list with its website, or
        dismisses it. One without a website, one decided already, and one the list refuses are
        skipped with the reason.
      tags: [admin]
      requestBody:
        required: true
        description: What to do, and to which candidates.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateDecisions"
      responses:
        "200":
          description: What happened to each candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDecisionResults"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitor-candidates/{competitorCandidateId}/split:
    post:
      operationId: splitCompetitorCandidate
      summary: Split a merged name off its company
      description: >-
        Administrators only. Takes a name Claude Haiku or a person merged into a candidate out of
        it again; it is not merged again. Names on one website stay one company: 409 for those.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CompetitorCandidateIdPath"
      responses:
        "204":
          description: Split off.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitor-candidates/{competitorCandidateId}/add:
    post:
      operationId: addCompetitorCandidate
      summary: Add a candidate to the competitor list
      description: >-
        Administrators only. Adds the candidate as a company with the name and website given,
        which can then be scanned. 409 when it was decided already or another company has the
        website.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CompetitorCandidateIdPath"
      requestBody:
        required: true
        description: The company to add.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCompetitor"
            example:
              name: Ashworth
              url: https://www.ashworth.com
      responses:
        "200":
          description: The candidate, added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorCandidate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitor-candidates/{competitorCandidateId}/dismiss:
    post:
      operationId: dismissCompetitorCandidate
      summary: Dismiss a candidate
      description: >-
        Administrators only. Dismisses the candidate; it stays dismissed in later runs until the
        decision is undone. 409 when it was decided already.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CompetitorCandidateIdPath"
      responses:
        "200":
          description: The candidate, dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorCandidate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/competitor-candidates/{competitorCandidateId}/decision:
    delete:
      operationId: undoCompetitorCandidate
      summary: Undo the decision on a candidate
      description: >-
        Administrators only. Puts the candidate back among the pending ones; an added candidate's
        company is removed again, with its scans. 404 when it has no decision.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CompetitorCandidateIdPath"
      responses:
        "204":
          description: Undone.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Get the signed-in account
      description: >-
