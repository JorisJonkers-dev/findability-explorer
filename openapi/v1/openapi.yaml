        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/credentials/{credentialId}/test:
    post:
      operationId: testLlmCredential
      summary: Test an API key
      description: >-
        Asks the provider whether it accepts the key (by listing its models) and records the
        outcome on the credential and in the events. A refused key is a 200 with ok false; an
        unreadable stored key answers 422.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmTest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/credentials/{credentialId}/models:
    get:
      operationId: listLlmModels
      summary: List the models an API key can use
      description: >-
        Asks the provider for its models with this key. 502 when the provider fails or refuses;
        422 when the stored key is unreadable.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: The models, by id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/credentials/{credentialId}/usage:
    get:
      operationId: getLlmKeyUsage
      summary: Get what the provider reports a key used
      description: >-
        Administrators only. OpenRouter's own figures for an OpenRouter key (spend all time, today,
        this week and this month, its limit, the day's free-model requests); Anthropic's usage
        report of this month for an Anthropic key, per model, and the organisation's cost, read
        with a stored Anthropic Admin key (without one, nothing). Mistral reports nothing. 502 when
        the provider fails.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: The usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmKeyUsage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/active:
    put:
      operationId: setActiveLlm
      summary: Choose the credential and model for product matching
      description: >-
        Makes product matching use this credential and model from the next analysis on. The
        credential must exist (404) and be readable (422).
      tags: [admin]
      requestBody:
        required: true
        description: The credential and model to use.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveLlm"
            example:
              credentialId: vault-anthropic
              model: claude-haiku-5-5
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearActiveLlm
      summary: Turn product matching off
      description: Turns product matching off until a credential and model are chosen again.
      tags: [admin]
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    CompetitorIdPath:
      name: competitorId
      in: path
      required: true
      description: The company's id.
      schema:
        $ref: "#/components/schemas/CompetitorId"
    CandidateId:
      name: candidateId
      in: path
      required: true
      description: The candidate's id.
      schema:
        $ref: "#/components/schemas/TermCandidateId"
    RunId:
      name: runId
      in: path
      required: true
      description: The Prompt run's id.
      schema:
        type: string
        format: uuid
        maxLength: 36
    CompetitorCandidateIdPath:
      name: competitorCandidateId
      in: path
      required: true
      description: The competitor candidate's id.
      schema:
        $ref: "#/components/schemas/CompetitorCandidateId"
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The credential's id.
      schema:
        $ref: "#/components/schemas/LlmCredentialId"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fe_session
      description: >-
        The sealed id of a server-side session, set by /auth/callback after signing in with
        auth-api (HttpOnly, SameSite=Lax). Without a live session the API answers 401; admin
        operations answer 403 unless auth-api currently grants ROLE_ADMIN. On a local run DEV_USER
        (and DEV_ROLES) stand in for a session.
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Language:
      description: A language as the terminology map records it; en-US marks American usage.
      type: string
      enum: [de, en, en-US, nl, fr, pl, it, es, sv, da]
    IntentTier:
      description: The kind of search a term represents.
      type: string
      enum: [spec, product, application, problem, broad]
    BeltFamily:
      description: >-
        The Tribelt belt family a term names. `all` is a term for every family (a broad category),
        `spec_all` a material or specification word that applies to every family.
      type: string
      enum: [eyelink, open_spiral, closed_spiral, tri_flex_turn_curve, other, all, spec_all]
    Term:
      description: One name for a belt, material or specification, as a company uses it.
      type: object
      additionalProperties: false
      required: [term, language, family, tier, usedBy, source, origin]
      properties:
        origin:
          $ref: "#/components/schemas/TermOrigin"
        term:
          type: string
          maxLength: 200
          description: The term as written on the source page.
          example: Drahtösengliederband
        language:
          $ref: "#/components/schemas/Language"
        family:
          $ref: "#/components/schemas/BeltFamily"
        tier:
          $ref: "#/components/schemas/IntentTier"
        usedBy:
          type: array
          maxItems: 20
          description: The companies that use the term.
          items:
            type: string
            maxLength: 200
            example: Märtens
        foundBy:
          type: array
          maxItems: 10000
          description: >-
            The companies whose newest finished scan found the term on their site, by id. They
            use it too, though the desk research or the review did not name them; absent when no
            scan found it.
          items:
            $ref: "#/components/schemas/CompetitorId"
        source:
          type: string
          maxLength: 500
          description: The page the term was taken from.
          example: https://www.martens-belts.com/de/produkte/metallfoerderband
    FacetCount:
      description: How many matching terms have one value of a facet.
      type: object
      additionalProperties: false
      required: [value, count]
      properties:
        value:
          type: string
          maxLength: 32
          description: The facet value.
          example: de
        count:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The number of matching terms with this value.
          example: 32
    Facets:
      description: Counts of the terms that match the query, per facet value, ignoring that facet's own filter.
      type: object
      additionalProperties: false
      required: [languages, tiers, families]
      properties:
        languages:
          type: array
          maxItems: 20
          description: Counts per language.
          items:
            $ref: "#/components/schemas/FacetCount"
        tiers:
          type: array
          maxItems: 20
          description: Counts per intent tier.
          items:
            $ref: "#/components/schemas/FacetCount"
        families:
          type: array
          maxItems: 20
          description: Counts per belt family.
          items:
            $ref: "#/components/schemas/FacetCount"
    TermSearch:
      description: A page of matching terms.
      type: object
      additionalProperties: false
      required: [items, total, facets]
      properties:
        items:
          type: array
          maxItems: 10000
          description: The matching terms, best match first.
          items:
            $ref: "#/components/schemas/Term"
        total:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many terms match, before the limit.
          example: 14
        facets:
          $ref: "#/components/schemas/Facets"
    BeltName:
      description: A company's own name for a belt, and the Tribelt family it corresponds to.
      type: object
      additionalProperties: false
      required: [name, family]
      properties:
        name:
          type: string
          maxLength: 300
          description: The company's product name.
          example: TwenteFlex spiral belts
        family:
          $ref: "#/components/schemas/BeltFamily"
        fromScan:
          type: boolean
          description: True when the company's newest scan found the name, not the desk research.
    CompetitorId:
      description: A company's id, made from its name.
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      example: twentebelt
    CompetitorSource:
      description: Where a company comes from - the desk research, or added by a user or a scan.
      type: string
      enum: [research, added]
    Competitor:
      description: A known company.
      type: object
      additionalProperties: false
      required: [id, source, role, name, country, website, languages, groupCompany, beltNames, homepageTitle, scans, archived]
      properties:
        role:
          $ref: "#/components/schemas/CompanyRole"
        archived:
          type: boolean
          description: >-
            True for a company an administrator or Claude Haiku archived: it is left out of the
            re-scans, its scans stay, and the web app hides it.
        archivedBy:
          type: string
          maxLength: 200
          description: >-
            Who archived it: an administrator, or `language model` for Claude Haiku, which archives
            a company it is sure does not compete with Tribelt. Absent unless archived.
          example: language model
        archivedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it was archived. Absent unless archived.
          example: "2026-10-27T09:30:00Z"
        keptBy:
          type: string
          maxLength: 200
          description: >-
            The administrator who restored the company or kept it on the list; Claude Haiku never
            archives it then. Absent when nobody did.
          example: joris
        id:
          $ref: "#/components/schemas/CompetitorId"
        source:
          $ref: "#/components/schemas/CompetitorSource"
        websiteUrl:
          type: string
          format: uri
          maxLength: 500
          description: The website to visit and to scan; absent when the research found none.
          example: https://www.twentebelt.com
        host:
          type: string
          maxLength: 253
          description: The website's host without "www.", by which scans are matched to the company.
          example: twentebelt.com
        scans:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many scans of the company's website were started.
          example: 2
        lastScan:
          $ref: "#/components/schemas/AnalysisSummary"
        addedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the company was added; only for added companies.
          example: "2026-10-22T09:30:00Z"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
        country:
          type: string
          maxLength: 200
          description: Where the company is based.
          example: NL
        website:
          type: string
          maxLength: 500
          description: The company's website as the research noted it, or the added address.
          example: https://www.twentebelt.com
        languages:
          type: array
          maxItems: 20
          description: The languages its website is in.
          items:
            type: string
            maxLength: 16
            example: en
        groupCompany:
          type: boolean
          description: True for a company in Tribelt's own group, which is never a competitor.
        beltNames:
          type: array
          maxItems: 100
          description: >-
            The company's names for its belts: the desk research's, then the products its newest
            scan matched to Tribelt's families (fromScan).
          items:
            $ref: "#/components/schemas/BeltName"
        homepageTitle:
          type: string
          maxLength: 300
          description: The title of its home page, or "unverified" when it could not be read.
          example: Twentebelt | Metal conveyor belts
    CompanyRole:
      description: >-
        What a company is to Tribelt - Tribelt itself (the baseline), the group's mirror of
        tribelt.nl (the report's recommendations in practice), a company in Tribelt's group (a
        benchmark), or a competitor. Only competitors count as competitors.
      type: string
      enum: [tribelt, mirror, group, competitor]
    NewCompetitorItem:
      description: One company of a batch; one without a valid name or website is rejected on its own.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 300
          description: The company's name.
          example: Intralox
        url:
          type: string
          maxLength: 500
          description: Its website, an http or https address on a public host.
          example: https://www.intralox.com
        candidateId:
          $ref: "#/components/schemas/CompetitorCandidateId"
    CompetitorBatchRequest:
      description: Companies to add at once.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          description: The companies, in order.
          items:
            $ref: "#/components/schemas/NewCompetitorItem"
        scan:
          type: boolean
          description: Whether to scan the added companies straight away.
          example: true
    CompetitorBatchOutcome:
      description: What became of one item - added, skipped as a duplicate, or rejected.
      type: string
      enum: [added, duplicate, rejected]
    CompetitorBatchItem:
      description: One item's outcome.
      type: object
      additionalProperties: false
      required: [name, outcome]
      properties:
        name:
          type: string
          maxLength: 300
          description: The name as added, or as sent.
          example: Intralox
        outcome:
          $ref: "#/components/schemas/CompetitorBatchOutcome"
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        reason:
          type: string
          maxLength: 300
          description: Why it was skipped or rejected.
          example: Add its website first.
    CompetitorBatch:
      description: What a batch did.
      type: object
      additionalProperties: false
      required: [items, scans]
      properties:
        items:
          type: array
          maxItems: 100
          description: Each item's outcome, in order.
          items:
            $ref: "#/components/schemas/CompetitorBatchItem"
        scans:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: How many scans started.
          example: 2
    NewCompetitor:
      description: A company to add.
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The company's name.
          example: Example Belts
        url:
          type: string
          format: uri
          minLength: 8
          maxLength: 500
          description: The company's website. Only http and https on a public host.
          example: https://www.example-belts.com
    CompetitorDetail:
      description: A company with its most recent scans.
      type: object
      additionalProperties: false
      required: [competitor, scans]
      properties:
        competitor:
          $ref: "#/components/schemas/Competitor"
        scans:
          type: array
          maxItems: 100
          description: The company's scans, newest first.
          items:
            $ref: "#/components/schemas/AnalysisSummary"
    CompetitorList:
      description: Every known company.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10000
          description: The companies.
          items:
            $ref: "#/components/schemas/Competitor"
    NewAnalysis:
      description: A website to analyse.
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 8
          maxLength: 500
          description: The page to start from. Only http and https on a public host.
          example: https://www.twentebelt.com
        maxPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 60
          description: The most pages to fetch.
          example: 60
        companyName:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            The name to add the company under when no known company has this website's host.
            Without it, an unknown company is added under its host.
          example: Example Belts
    AnalysisStatus:
      description: Where an analysis is in its life.
      type: string
      enum: [queued, running, done, failed]
    MatchingStatus:
      description: >-
        What happened to the product matching by the language model: pending until the crawl
        ends, disabled when no model is configured, skipped when the budget is spent or the site
        gave no text, then done or failed.
      type: string
      enum: [pending, disabled, skipped, done, failed]
    AnalysisSummary:
      description: An analysis without its results.
      type: object
      additionalProperties: false
      required: [id, url, status, maxPages, pagesCrawled, createdAt]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        number:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: >-
            The scan's number among its company's scans, from 1 for the first; it never changes.
            Absent for an analysis without a company.
          example: 3
        matchingModel:
          type: string
          maxLength: 300
          description: The provider and model that matched the products, when a model was asked.
          example: "openrouter: anthropic/claude-haiku-5-5"
        id:
          type: string
          format: uuid
          maxLength: 36
          description: The analysis's id.
          example: 5b0c1a9e-2d3f-4e5a-8b6c-7d8e9f0a1b2c
        url:
          type: string
          maxLength: 500
          description: The page the crawl started from.
          example: https://www.twentebelt.com
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        failure:
          type: string
          maxLength: 500
          description: Why the analysis failed; only when status is failed.
          example: The site did not answer within 10 seconds.
        blocked:
          type: boolean
          description: >-
            True when the analysis failed because its site turned automated readers away (bot
            protection) although people can open it; only then is it present. The scan still
            records the site's AI readiness.
        aiReadiness:
          $ref: "#/components/schemas/AiReadinessBrief"
        maxPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: The most pages the crawl fetches.
          example: 60
        pagesCrawled:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: How many pages were fetched so far.
          example: 7
        createdAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the analysis was queued.
          example: "2026-10-22T09:30:00Z"
        finishedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the analysis finished; only when status is done or failed.
          example: "2026-10-22T09:31:10Z"
    AnalysisList:
      description: Recent analyses, newest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10000
          description: The analyses.
          items:
            $ref: "#/components/schemas/AnalysisSummary"
    CrawledPage:
      description: One page the crawl fetched, with the belt family it is about when that is clear.
      type: object
      additionalProperties: false
      required: [url, title, description, language, wordCount]
      properties:
        url:
          type: string
          maxLength: 2000
          description: The page's address.
          example: https://www.twentebelt.com/conveyor-belts/
        title:
          type: string
          maxLength: 500
          description: The page title.
          example: Conveyor belts - Twentebelt
        description:
          type: string
          maxLength: 1000
          description: The meta description.
          example: Metal conveyor belts for the food processing industry.
        language:
          type: string
          maxLength: 16
          description: The page's language, from its markup or guessed from its words.
          example: en
        wordCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          description: The number of words of visible text.
          example: 412
        family:
          $ref: "#/components/schemas/BeltFamily"
    Keyword:
      description: >-
        A phrase about metal belts that the site emphasises, scored by where and how often it
        appears. Phrases without a word of the belt vocabulary, phrases that only name the site
        itself, and menu or footer text are left out.
      type: object
      additionalProperties: false
      required: [phrase, language, score, pages, tier, inMap]
      properties:
        tier:
          $ref: "#/components/schemas/IntentTier"
        family:
          $ref: "#/components/schemas/BeltFamily"
        closestTerm:
          type: string
          maxLength: 200
          description: The terminology map term that shares the most specific words with the phrase.
          example: balanced weave belt
        inMap:
          type: boolean
          description: >-
            True when the phrase is one of the map's own terms. A phrase that is not is a search
            term the map, and Tribelt, may be missing.
        phrase:
          type: string
          maxLength: 200
          description: The phrase, in lower case.
          example: metal conveyor belts
        language:
          type: string
          maxLength: 16
          description: The language of the pages it appears on.
          example: en
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Higher is more prominent; a title counts more than body text.
          example: 42.5
        pages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: On how many pages the phrase appears.
          example: 6
    KnownTerm:
      description: A term from the terminology map that the site uses.
      type: object
      additionalProperties: false
      required: [term, language, family, tier, occurrences, usedByTribelt]
      properties:
        term:
          type: string
          maxLength: 200
          description: The term as the map records it.
          example: balanced weave belt
        usedByTribelt:
          type: boolean
          description: >-
            True when Tribelt's own website uses the term too. A term the site uses and Tribelt
            does not is a search Tribelt is missing.
        language:
          $ref: "#/components/schemas/Language"
        family:
          $ref: "#/components/schemas/BeltFamily"
        tier:
          $ref: "#/components/schemas/IntentTier"
        occurrences:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000000
          description: How often the term appears across the crawled pages.
          example: 9
    SearchTerm:
      description: A term people may search with, in one language.
      type: object
      additionalProperties: false
      required: [term, language]
      properties:
        term:
          type: string
          maxLength: 200
          description: The search term.
          example: spiral belt
        language:
          type: string
          maxLength: 16
          description: Its language.
          example: en
    Equivalent:
      description: A product on the site matched to a Tribelt belt family by the language model.
      type: object
      additionalProperties: false
      required: [product, family, reason, searchTerms]
      properties:
        product:
          type: string
          maxLength: 300
          description: The site's own name for the product.
          example: TwenteFlex spiral belts
        family:
          $ref: "#/components/schemas/BeltFamily"
        reason:
          type: string
          maxLength: 1000
          description: Why the model judged the product equivalent.
          example: A curve-going spiral-tower belt, like Tri-Flex.
        searchTerms:
          type: array
          maxItems: 30
          description: The terms the site uses for the product, per language.
          items:
            $ref: "#/components/schemas/SearchTerm"
    Analysis:
      description: An analysis with its progress and results.
      type: object
      additionalProperties: false
      required: [summary, pages, keywords, knownTerms, matching, equivalents]
      properties:
        summary:
          $ref: "#/components/schemas/AnalysisSummary"
        pages:
          type: array
          maxItems: 100
          description: The pages fetched, in crawl order.
          items:
            $ref: "#/components/schemas/CrawledPage"
        keywords:
          type: array
          maxItems: 1000
          description: The site's most prominent phrases, highest score first.
          items:
            $ref: "#/components/schemas/Keyword"
        knownTerms:
          type: array
          maxItems: 10000
          description: Terms from the terminology map found on the site, most frequent first.
          items:
            $ref: "#/components/schemas/KnownTerm"
        matching:
          $ref: "#/components/schemas/MatchingStatus"
        matchingModel:
          type: string
          maxLength: 300
          description: >-
            The provider and model that matched the products, when a model was asked.
          example: "openrouter: anthropic/claude-haiku-5-5"
        equivalents:
          type: array
          maxItems: 50
          description: The site's products matched to Tribelt's belt families.
          items:
            $ref: "#/components/schemas/Equivalent"
        aiReadiness:
          $ref: "#/components/schemas/AiReadiness"
    Me:
      description: The signed-in account.
      type: object
      additionalProperties: false
      required: [subject, name, isAdmin]
      properties:
        subject:
          type: string
          maxLength: 200
          description: The account's subject at auth-api.
          example: 3f2a9c4e-7d1b-4c6a-9e8f-1a2b3c4d5e6f
        name:
          type: string
          maxLength: 200
          description: The name to greet the account with.
          example: joris
        email:
          type: string
          format: email
          maxLength: 320
          description: The account's email address, when auth-api shares it.
          example: joris@example.com
        isAdmin:
          type: boolean
          description: True when auth-api grants ROLE_ADMIN, which the admin settings need.
    LlmProvider:
      description: >-
        A language-model provider. `anthropic_admin` is an Anthropic Admin key, which only reads
        the organisation's usage and cost reports and never answers.
      type: string
      enum: [anthropic, openrouter, mistral, anthropic_admin]
    LlmCredentialId:
      description: >-
        A credential's id: a UUID for a stored key, or `vault-anthropic` for the key Vault
        delivers in ANTHROPIC_API_KEY.
      type: string
      minLength: 15
      maxLength: 36
      pattern: "^(vault-anthropic|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"
      example: vault-anthropic
    LlmCredentialSource:
      description: Where a credential comes from - added here and stored sealed, or delivered by Vault.
      type: string
      enum: [stored, vault]
    LlmTest:
      description: The outcome of asking the provider whether it accepts a key.
      type: object
      additionalProperties: false
      required: [ok, at, message]
      properties:
        ok:
          type: boolean
          description: True when the provider accepted the key.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When the key was tested.
          example: "2026-10-23T09:30:00Z"
        message:
          type: string
          maxLength: 500
          description: What the provider said, or how many models the key may use.
          example: The key may use 312 models.
    LlmCredential:
      description: A language-model API key, shown without its secret.
      type: object
      additionalProperties: false
      required: [id, provider, label, source, fingerprint, readable]
      properties:
        id:
          $ref: "#/components/schemas/LlmCredentialId"
        provider:
          $ref: "#/components/schemas/LlmProvider"
        label:
          type: string
          maxLength: 100
          description: A name to tell keys apart.
          example: Course budget key
        source:
          $ref: "#/components/schemas/LlmCredentialSource"
        fingerprint:
          type: string
          minLength: 12
          maxLength: 12
          pattern: "^[0-9a-f]{12}$"
          description: >-
            The first 12 hex characters of the key's SHA-256: enough to tell keys apart, never
            enough to recover one.
          example: 3a7bd3e2360a
        readable:
          type: boolean
          description: >-
            False when the key was sealed under another SESSION_KEY and has to be entered again.
        createdBy:
          type: string
          maxLength: 200
          description: Who added the key; absent for the Vault key.
          example: joris
        createdAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the key was added; absent for the Vault key.
          example: "2026-10-23T09:30:00Z"
        lastTest:
          $ref: "#/components/schemas/LlmTest"
    NewLlmCredential:
      description: An API key to add.
      type: object
      additionalProperties: false
      required: [provider, label, apiKey]
      properties:
        provider:
          $ref: "#/components/schemas/LlmProvider"
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: A name to tell keys apart.
          example: Course budget key
        apiKey:
          type: string
          minLength: 8
          maxLength: 500
          description: The secret key. It is stored sealed and never returned.
          example: sk-or-v1-0000
    LlmModel:
      description: A model a key may use.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          maxLength: 200
          description: The provider's id for the model, which setActiveLlm takes.
          example: anthropic/claude-haiku-5-5
        name:
          type: string
          maxLength: 300
          description: The provider's display name for it, or the id.
          example: "Anthropic: Claude Haiku 5.5"
    LlmUsageSource:
      description: >-
        Where a key's usage figures come from - OpenRouter's own figures, Anthropic's reports read
        with an Admin key, or none (the provider reports nothing for the key).
      type: string
      enum: [openrouter, anthropic, none]
    LlmFreeRequests:
      description: OpenRouter's count of the day's requests to free models.
      type: object
      additionalProperties: false
      required: [used, limit, remaining]
      properties:
        used:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          description: Requests today.
          example: 12
        limit:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          description: Requests allowed a day.
          example: 1000
        remaining:
          type: integer
          format: int32
          minimum: -10000000
          maximum: 10000000
          description: Requests left today.
          example: 988
    LlmModelTokens:
      description: The tokens a key used with one model this month, as Anthropic reports them.
      type: object
      additionalProperties: false
      required: [model, inputTokens, outputTokens, cacheReadTokens]
      properties:
        model:
          type: string
          maxLength: 200
          description: The model.
          example: claude-haiku-5-5
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: Input tokens, cache writes included.
          example: 120000
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: Output tokens.
          example: 30000
        cacheReadTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: Input tokens read from the cache.
          example: 0
    LlmKeyUsage:
      description: What a provider reports a key used.
      type: object
      additionalProperties: false
      required: [source, message, models]
      properties:
        source:
          $ref: "#/components/schemas/LlmUsageSource"
        message:
          type: string
          maxLength: 500
          description: What the figures are, or why there are none.
          example: OpenRouter's own figures for this key, in dollars.
        totalUsd:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          description: OpenRouter - the key's spend, all time.
          example: 25.5
        dailyUsd:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          description: OpenRouter - today's (UTC).
          example: 1.2
        weeklyUsd:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          description: OpenRouter - this week's (UTC, from Monday).
          example: 5.6
        monthlyUsd:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          description: OpenRouter - this month's (UTC).
          example: 24.5
        limitUsd:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          description: OpenRouter - the key's own limit; absent when it has none.
          example: 100
        limitRemainingUsd:
          type: number
          format: double
          minimum: -1000000000
          maximum: 1000000000
          description: OpenRouter - what is left of the limit.
          example: 75.5
        limitReset:
          type: string
          maxLength: 20
          description: OpenRouter - when the limit resets (daily, weekly, monthly); absent when never.
          example: monthly
        freeRequests:
          $ref: "#/components/schemas/LlmFreeRequests"
        models:
          type: array
          maxItems: 1000
          description: Anthropic - this month's tokens per model.
          items:
            $ref: "#/components/schemas/LlmModelTokens"
        organisationCostUsd:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          description: Anthropic - the whole organisation's cost this month; Anthropic does not report it per key.
          example: 2
        since:
          type: string
          format: date-time
          maxLength: 64
          description: Anthropic - the start of the month the figures cover.
          example: "2026-10-01T00:00:00Z"
    LlmModelList:
      description: The models a key may use, by id.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 2000
          description: The models.
          items:
            $ref: "#/components/schemas/LlmModel"
    ActiveLlm:
      description: The credential and model product matching uses.
      type: object
      additionalProperties: false
      required: [credentialId, model]
      properties:
        credentialId:
          $ref: "#/components/schemas/LlmCredentialId"
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: The provider's id for the model.
          example: claude-haiku-5-5
    LlmChoice:
      description: >-
        How the active model was decided - `default` (nobody chose; the Vault key with
        claude-haiku-5-5 when Vault delivers one), `chosen` (an admin chose), or `off` (an admin
        turned matching off).
      type: string
      enum: [default, chosen, off]
    LlmEventAction:
      description: What an event records.
      type: string
      enum: [credential_added, credential_deleted, credential_tested, active_set, active_cleared]
    LlmEvent:
      description: One change to or test of the language-model settings.
      type: object
      additionalProperties: false
      required: [at, actor, action, message]
      properties:
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it happened.
          example: "2026-10-23T09:30:00Z"
        actor:
          type: string
          maxLength: 200
          description: Who did it.
          example: joris
        action:
          $ref: "#/components/schemas/LlmEventAction"
        credentialId:
          $ref: "#/components/schemas/LlmCredentialId"
        provider:
          $ref: "#/components/schemas/LlmProvider"
        model:
          type: string
          maxLength: 200
          description: The model, for active_set.
          example: claude-haiku-5-5
        ok:
          type: boolean
          description: For credential_tested and credential_added, whether the provider accepted the key.
        message:
          type: string
          maxLength: 500
          description: A sentence describing the event.
          example: Added openrouter key "Course budget key" (3a7bd3e2360a).
    LlmBudget:
      description: >-
        What every job on the language model may spend in a month together - the scans' product
        matching, the term review, the competitor review and Claude Haiku's reading of Prompt
        answers. Each stops when the month's tokens are spent.
      type: object
      additionalProperties: false
      required: [monthlyTokens, usedThisMonth, averageTokensPerScan, scansMatched]
      properties:
        monthlyTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: The tokens every job together may use in a calendar month (UTC).
          example: 10000000
        usedThisMonth:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: The tokens every job used this month so far.
          example: 48211
        averageTokensPerScan:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: >-
            The tokens one scan's product matching used on average, over every scan the language
            model answered for; 0 before the first.
          example: 29137
        scansMatched:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: How many scans the average is over.
          example: 2
    LlmSettings:
      description: The language-model settings.
      type: object
      additionalProperties: false
      required: [credentials, choice, matchingEnabled, budget, events]
      properties:
        credentials:
          type: array
          maxItems: 100
          description: Every credential, the Vault one first, then stored ones oldest first.
          items:
            $ref: "#/components/schemas/LlmCredential"
        choice:
          $ref: "#/components/schemas/LlmChoice"
        active:
          $ref: "#/components/schemas/ActiveLlm"
        haiku:
          $ref: "#/components/schemas/ActiveLlm"
          description: >-
            The Anthropic key and Claude Haiku model that match products and read Prompt test
            answers, instead of the active model, while an Anthropic key works - the Vault key, else
            a stored Anthropic key whose latest test did not fail. Product matching turned off stays
            off on it. Absent when no Anthropic key works.
        matchingEnabled:
          type: boolean
          description: >-
            True when the next analysis will match products: matching is not turned off, and Haiku
            works or the active model's credential is readable.
        budget:
          $ref: "#/components/schemas/LlmBudget"
        events:
          type: array
          maxItems: 50
          description: The latest changes and tests, newest first.
          items:
            $ref: "#/components/schemas/LlmEvent"
    TermOrigin:
      description: >-
        Where a term comes from - the desk research of 22 October 2026, or a scan's phrase an
        administrator accepted from the review queue.
      type: string
      enum: [research, review]
    CompetitorUpdate:
      description: The fields of a company to change; at least one.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The company's new name.
          example: Example Belts
        url:
          type: string
          format: uri
          minLength: 8
          maxLength: 500
          description: The company's new website. Only http and https on a public host.
          example: https://www.example-belts.com
        archived:
          type: boolean
          description: >-
            True archives the company: it leaves the list and the re-scans, and its scans stay.
            False restores it, and keeps it: Claude Haiku never archives it again.
        kept:
          type: boolean
          description: >-
            True records that the administrator keeps the company on the list, so Claude Haiku
            never archives it; false takes that back.
    RescanRequest:
      description: >-
        Which companies to scan - the ones named; with `all` every company that is not archived,
        has a website and has data; or with `unscanned` every company that is not archived and has
        a website no scan reached yet. Exactly one of the three.
      type: object
      additionalProperties: false
      properties:
        competitorIds:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          description: The companies to scan again.
          items:
            $ref: "#/components/schemas/CompetitorId"
        all:
          type: boolean
          description: True scans every company with data again.
        unscanned:
          type: boolean
          description: True scans every company with a website that no scan reached yet.
        maxPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 60
          description: The most pages each scan fetches.
          example: 60
    RescanSkip:
      description: A company a re-scan left out, and why.
      type: object
      additionalProperties: false
      required: [competitorId, name, reason]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
        reason:
          type: string
          maxLength: 300
          description: Why it was left out.
          example: A scan of it is still queued or running.
    RescanBatch:
      description: The scans a re-scan queued, and the companies it left out.
      type: object
      additionalProperties: false
      required: [queued, skipped]
      properties:
        queued:
          type: array
          maxItems: 10000
          description: The queued scans, one per company.
          items:
            $ref: "#/components/schemas/AnalysisSummary"
        skipped:
          type: array
          maxItems: 10000
          description: The companies left out.
          items:
            $ref: "#/components/schemas/RescanSkip"
    ProfileGroup:
      description: >-
        How a company's search terms are grouped - one of Tribelt's belt families, other metal
        belts, broad terms that name no family, or material and specification terms.
      type: string
      enum: [eyelink, open_spiral, closed_spiral, tri_flex_turn_curve, other, broad, spec]
    ProfileTerm:
      description: A search term of a company's latest finished scan.
      type: object
      additionalProperties: false
      required: [phrase, language, score, pages, tier, inMap, firstScan]
      properties:
        phrase:
          type: string
          maxLength: 200
          description: The phrase, in lower case.
          example: balanced weave belts
        language:
          type: string
          maxLength: 16
          description: The language of the pages it appears on.
          example: en
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Higher is more prominent.
          example: 42.5
        pages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: On how many pages it appears.
          example: 6
        tier:
          $ref: "#/components/schemas/IntentTier"
        family:
          $ref: "#/components/schemas/BeltFamily"
        closestTerm:
          type: string
          maxLength: 200
          description: The terminology map term closest to it.
          example: balanced weave belt
        inMap:
          type: boolean
          description: True when it is one of the map's own terms.
        firstScan:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The number of the company's first finished scan that found it.
          example: 1
    ProfileGroupTerms:
      description: The search terms of one group, highest score first.
      type: object
      additionalProperties: false
      required: [group, terms]
      properties:
        group:
          $ref: "#/components/schemas/ProfileGroup"
        terms:
          type: array
          maxItems: 10000
          description: The terms.
          items:
            $ref: "#/components/schemas/ProfileTerm"
    CompetitorProfile:
      description: >-
        A company's search terms from its latest finished scan, by group, every group present
        in a fixed order (Tribelt's families, other, broad, spec).
      type: object
      additionalProperties: false
      required: [competitorId, groups, languages, finishedScans]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        scan:
          $ref: "#/components/schemas/AnalysisSummary"
        finishedScans:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many of the company's scans finished.
          example: 2
        languages:
          type: array
          maxItems: 20
          description: The languages of the terms, most terms first.
          items:
            type: string
            maxLength: 16
            example: de
        groups:
          type: array
          maxItems: 7
          description: The terms by group; empty without a finished scan.
          items:
            $ref: "#/components/schemas/ProfileGroupTerms"
    TermChange:
      description: >-
        A search term one scan found and the other did not, or whose score or page count moved.
        The from fields are absent for an added term, the to fields for a removed one.
      type: object
      additionalProperties: false
      required: [phrase, language, tier, inMap]
      properties:
        phrase:
          type: string
          maxLength: 200
          description: The phrase, in lower case.
          example: spiral freezer belt
        language:
          type: string
          maxLength: 16
          description: Its language.
          example: en
        tier:
          $ref: "#/components/schemas/IntentTier"
        family:
          $ref: "#/components/schemas/BeltFamily"
        inMap:
          type: boolean
          description: True when it is one of the map's own terms.
        fromScore:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Its score in the older scan.
          example: 12
        toScore:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Its score in the newer scan.
          example: 30.5
        fromPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Its pages in the older scan.
          example: 2
        toPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Its pages in the newer scan.
          example: 5
    ComparisonGroup:
      description: What changed in one group between two scans.
      type: object
      additionalProperties: false
      required: [group, added, removed, moved]
      properties:
        group:
          $ref: "#/components/schemas/ProfileGroup"
        added:
          type: array
          maxItems: 10000
          description: Terms only the newer scan found, highest score first.
          items:
            $ref: "#/components/schemas/TermChange"
        removed:
          type: array
          maxItems: 10000
          description: Terms only the older scan found, highest score first.
          items:
            $ref: "#/components/schemas/TermChange"
        moved:
          type: array
          maxItems: 10000
          description: Terms both found whose score or pages moved beyond the threshold, largest move first.
          items:
            $ref: "#/components/schemas/TermChange"
    ScanComparison:
      description: >-
        Two finished scans of a company compared, per group. A term moved when its score changed
        by at least a quarter and 5 points, or its page count by at least 2.
      type: object
      additionalProperties: false
      required: [from, to, groups]
      properties:
        from:
          $ref: "#/components/schemas/AnalysisSummary"
        to:
          $ref: "#/components/schemas/AnalysisSummary"
        groups:
          type: array
          maxItems: 7
          description: Every group, in the profile's order.
          items:
            $ref: "#/components/schemas/ComparisonGroup"
        readiness:
          type: array
          maxItems: 50
          description: >-
            What changed in AI readiness, in the readiness's order; absent when either scan recorded
            no AI readiness, empty when nothing changed.
          items:
            $ref: "#/components/schemas/ReadinessChange"
    TermCandidateId:
      description: A candidate's id, made from its phrase and its language.
      type: string
      minLength: 16
      maxLength: 16
      pattern: "^[0-9a-f]{16}$"
      example: 3a7bd3e2360a9f01
    TermCandidateStatus:
      description: Where a candidate is in the review.
      type: string
      enum: [pending, accepted, rejected]
    CandidateCompany:
      description: A company whose scan found a candidate.
      type: object
      additionalProperties: false
      required: [competitorId, name]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
    TermDecision:
      description: An administrator's decision on a candidate.
      type: object
      additionalProperties: false
      required: [status, by, at]
      properties:
        status:
          $ref: "#/components/schemas/TermCandidateStatus"
        by:
          type: string
          maxLength: 200
          description: Who decided; `language model` for Claude Haiku.
          example: joris
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When.
          example: "2026-10-23T09:30:00Z"
        term:
          $ref: "#/components/schemas/Term"
    TermCandidate:
      description: >-
        A phrase finished scans found that the terminology map did not hold, with its evidence
        across companies and the classifier's suggestion.
      type: object
      additionalProperties: false
      required: [id, phrase, status, languages, companies, scans, bestScore, maxPages, suggestedTier, lastSeenAt]
      properties:
        id:
          $ref: "#/components/schemas/TermCandidateId"
        phrase:
          type: string
          maxLength: 200
          description: The phrase, in lower case.
          example: spiral freezer belt
        status:
          $ref: "#/components/schemas/TermCandidateStatus"
        languages:
          type: array
          maxItems: 20
          description: >-
            The language it was found in, its only one: the same phrase in another language is
            another candidate, and it joins the map only in this language. `und` when neither its
            pages nor its own words told the language; it then joins the map in the language the
            reviewer sets.
          items:
            type: string
            maxLength: 16
            example: en
        companies:
          type: array
          maxItems: 10000
          description: The companies whose scans found it, by name.
          items:
            $ref: "#/components/schemas/CandidateCompany"
        scans:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: How many finished scans found it.
          example: 3
        bestScore:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Its highest score in one scan.
          example: 42.5
        maxPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: The most pages of one scan it appeared on.
          example: 6
        suggestedTier:
          $ref: "#/components/schemas/IntentTier"
        suggestedFamily:
          $ref: "#/components/schemas/BeltFamily"
        closestTerm:
          type: string
          maxLength: 200
          description: The map term in its language the classifier found closest.
          example: spiral belt
        lastSeenAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the newest scan that found it was started.
          example: "2026-10-23T09:30:00Z"
        decision:
          $ref: "#/components/schemas/TermDecision"
        verdict:
          $ref: "#/components/schemas/TermVerdict"
    TermVerdict:
      description: >-
        The language model's review of a candidate. A sure verdict is also its decision; an unsure
        one leaves the candidate waiting for a person, with the term it suggests.
      type: object
      additionalProperties: false
      required: [accept, sure, reason, model, at]
      properties:
        accept:
          type: boolean
          description: Whether it would add the phrase to the map.
          example: true
        sure:
          type: boolean
          description: Whether it was sure; when not, a person decides.
          example: false
        reason:
          type: string
          maxLength: 500
          description: Why, in one sentence.
          example: Buyers search for this kind of belt.
        term:
          $ref: "#/components/schemas/TermSuggestion"
        model:
          type: string
          maxLength: 200
          description: The model that reviewed it.
          example: claude-haiku-5-5
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When.
          example: "2026-10-27T09:30:00Z"
    TermSuggestion:
      description: The term the language model would add, as the map would hold it.
      type: object
      additionalProperties: false
      required: [term, language, family, tier]
      properties:
        term:
          type: string
          maxLength: 200
          description: The term.
          example: spiral freezer belt
        language:
          $ref: "#/components/schemas/Language"
        family:
          $ref: "#/components/schemas/BeltFamily"
        tier:
          $ref: "#/components/schemas/IntentTier"
    TermReviewState:
      description: How far the language model is with the waiting candidates.
      type: object
      additionalProperties: false
      required: [running, waiting]
      properties:
        running:
          type: boolean
          description: Whether it is reviewing now.
          example: true
        waiting:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: How many waiting candidates it has not reviewed yet.
          example: 663
        problem:
          description: >-
            Why its last review stopped short - noModel (no Anthropic key is set up), budget (the
            month's language-model tokens are spent) or failed (the model or its provider failed).
            Absent when it went well.
          type: string
          enum: [noModel, budget, failed]
    TermCandidateCounts:
      description: How many candidates have each status.
      type: object
      additionalProperties: false
      required: [pending, accepted, rejected]
      properties:
        pending:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Pending candidates.
          example: 41
        accepted:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Accepted candidates.
          example: 3
        rejected:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Rejected candidates.
          example: 7
    TermCandidateList:
      description: The candidates with one status, and how far the language model is with them.
      type: object
      additionalProperties: false
      required: [items, counts, review]
      properties:
        items:
          type: array
          maxItems: 10000
          description: The candidates, most companies and highest score first.
          items:
            $ref: "#/components/schemas/TermCandidate"
        counts:
          $ref: "#/components/schemas/TermCandidateCounts"
        review:
          $ref: "#/components/schemas/TermReviewState"
    TermAcceptance:
      description: A candidate as it joins the terminology map.
      type: object
      additionalProperties: false
      required: [term, language, family, tier, usedBy]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 200
          description: The term as the map shows it.
          example: spiral freezer belt
        language:
          $ref: "#/components/schemas/Language"
        family:
          $ref: "#/components/schemas/BeltFamily"
        tier:
          $ref: "#/components/schemas/IntentTier"
        usedBy:
          type: array
          maxItems: 20
          description: The companies that use it.
          items:
            type: string
            minLength: 1
            maxLength: 200
            example: Twentebelt
    CrawlerAccess:
      description: >-
        How far robots.txt lets a crawler in - allowed (no page kept from it), partly (some pages
        kept from it, or only some open to it), or blocked (the whole site).
      type: string
      enum: [allowed, partly, blocked]
    BotRule:
      description: One search or AI crawler's access, by its robots.txt token.
      type: object
      additionalProperties: false
      required: [bot, access, named, followsAdvice]
      properties:
        bot:
          type: string
          maxLength: 40
          description: The crawler's robots.txt token.
          example: GPTBot
        access:
          $ref: "#/components/schemas/CrawlerAccess"
        named:
          type: boolean
          description: >-
            True when robots.txt names the crawler in a group of its own; otherwise it follows the
            * group, and robots.txt does not mention it.
        followsAdvice:
          type: boolean
          description: True unless the crawler is blocked; the report recommends letting every one in.
    RobotsStatus:
      description: >-
        What became of robots.txt - found, missing (so every crawler may read every page), or
        unreachable (the site would not serve it, so the crawler policy is unknown).
      type: string
      enum: [found, missing, unreachable]
    ReadinessCheck:
      description: One of the report's recommendations besides each crawler's access.
      type: string
      enum: [sitemapDeclared, sitemapLanguages, llmsTxt, markdown, organization, product, languages]
    ReadinessAdvice:
      description: Whether a site follows one recommendation.
      type: object
      additionalProperties: false
      required: [check, ok]
      properties:
        check:
          $ref: "#/components/schemas/ReadinessCheck"
        ok:
          type: boolean
          description: True when the site follows it.
    SitemapSummary:
      description: What a site's sitemaps list, without the addresses.
      type: object
      additionalProperties: false
      required: [declared, files, addresses, languages]
      properties:
        declared:
          type: boolean
          description: True when robots.txt lists a sitemap.
        files:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: How many sitemap files were read (at most 10).
          example: 3
        addresses:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: How many different addresses they list.
          example: 124
        languages:
          type: array
          maxItems: 3
          description: The ones of Dutch, German and English the addresses cover, by path or hreflang.
          items:
            type: string
            maxLength: 16
            example: de
    LlmsFacts:
      description: What a site's llms.txt holds.
      type: object
      additionalProperties: false
      required: [present, bytes, links]
      properties:
        present:
          type: boolean
          description: True when the site serves llms.txt.
        bytes:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000000
          description: Its size in bytes, as far as it was read.
          example: 5120
        links:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          description: How many links it lists.
          example: 124
    SiteStack:
      description: The tools behind a site, as far as its headers and home page tell; each absent when unknown.
      type: object
      additionalProperties: false
      properties:
        cms:
          type: string
          maxLength: 60
          description: The content management system.
          example: WordPress
        seoPlugin:
          type: string
          maxLength: 60
          description: The SEO plugin.
          example: Yoast SEO
        botProtection:
          type: string
          maxLength: 60
          description: The bot protection in front of it.
          example: Cloudflare
    AiReadiness:
      description: >-
        What a site tells search engines and AI assistants about itself, read by a scan before its
        page crawl, held against the report's recommendations.
      type: object
      additionalProperties: false
      required: [robots, bots, sitemap, llmsTxt, llmsFullTxt, markdown, homeRead, structuredData, languages, stack, advice, gaps]
      properties:
        checkedAt:
          type: string
          format: date-time
          maxLength: 40
          description: >-
            When an administrator checked it again after its scan, without a crawl; absent when
            the scan itself read it.
          example: "2026-10-27T18:30:00Z"
        robots:
          $ref: "#/components/schemas/RobotsStatus"
        bots:
          type: array
          maxItems: 20
          description: Each search and AI crawler's access; empty when robots.txt was unreachable.
          items:
            $ref: "#/components/schemas/BotRule"
        sitemap:
          $ref: "#/components/schemas/SitemapSummary"
        llmsTxt:
          $ref: "#/components/schemas/LlmsFacts"
        llmsFullTxt:
          type: boolean
          description: True when the site serves llms-full.txt.
        markdown:
          type: boolean
          description: True when llms.txt links to .md pages or the home page has a .md twin.
        homeRead:
          type: boolean
          description: True when the home page could be read; the structured data and languages need it.
        structuredData:
          type: array
          maxItems: 50
          description: The JSON-LD types on the home page, alphabetically.
          items:
            type: string
            maxLength: 100
            example: Organization
        languages:
          type: array
          maxItems: 50
          description: The language versions the home page declares (hreflang), Dutch, German and English first.
          items:
            type: string
            maxLength: 16
            example: de
        stack:
          $ref: "#/components/schemas/SiteStack"
        advice:
          type: array
          maxItems: 20
          description: Each recommendation besides the crawlers', and whether the site follows it.
          items:
            $ref: "#/components/schemas/ReadinessAdvice"
        gaps:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: How many recommendations the site does not follow, each blocked crawler included.
          example: 3
    FollowedCompany:
      description: A company the AI search trend follows.
      type: object
      additionalProperties: false
      required: [competitorId, name, role]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Ashworth
        role:
          $ref: "#/components/schemas/CompanyRole"
    ShareTrendPoint:
      description: One Prompt run in the trend.
      type: object
      additionalProperties: false
      required: [runStartedAt, shares]
      properties:
        runStartedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the run started.
          example: "2026-11-02T06:00:00Z"
        shares:
          type: array
          maxItems: 10
          description: The share of the run's answers naming each followed company, in the order of `followed`, from 0 to 1.
          items:
            type: number
            format: double
            minimum: 0
            maximum: 1
            example: 0.24
    CrawlerFeeds:
      description: What a crawler feeds - answers AI assistants give today, or what future models know.
      type: string
      enum: [today, future]
    TribeltCrawler:
      description: A crawler, the lab behind it, what letting it in gets Tribelt, and how far tribelt.nl lets it in.
      type: object
      additionalProperties: false
      required: [bot, lab, gets, feeds]
      properties:
        bot:
          type: string
          maxLength: 40
          description: Its robots.txt token.
          example: OAI-SearchBot
        lab:
          type: string
          maxLength: 60
          description: Who runs it.
          example: OpenAI
        gets:
          type: string
          maxLength: 200
          description: What letting it in gets Tribelt.
          example: Links in ChatGPT search answers
        feeds:
          $ref: "#/components/schemas/CrawlerFeeds"
        access:
          $ref: "#/components/schemas/CrawlerAccess"
    KeepingOut:
      description: A competitor whose robots.txt keeps crawlers out of the whole site.
      type: object
      additionalProperties: false
      required: [competitorId, name, blocked]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The competitor's name.
          example: Wire Belt Company
        blocked:
          type: array
          maxItems: 20
          description: The crawlers it keeps out.
          items:
            type: string
            maxLength: 40
            example: GPTBot
    ReadinessRank:
      description: A company in the readiness ranking.
      type: object
      additionalProperties: false
      required: [competitorId, name, role, score]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Märtens Transportbänder
        role:
          $ref: "#/components/schemas/CompanyRole"
        score:
          type: number
          format: double
          minimum: 0
          maximum: 5
          description: Readiness checks passed out of five, in halves.
          example: 3.5
    AiSearchSummary:
      description: The AI search summary.
      type: object
      additionalProperties: false
      required: [goal, followed, trend, crawlers, keepingOut, ranking, sites, questions, providers]
      properties:
        goal:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: The share of answers Tribelt aims to be named in.
          example: 0.4
        followed:
          type: array
          maxItems: 10
          description: The companies the trend follows - Tribelt, then the most named competitors.
          items:
            $ref: "#/components/schemas/FollowedCompany"
        trend:
          type: array
          maxItems: 50
          description: The newest runs, oldest first.
          items:
            $ref: "#/components/schemas/ShareTrendPoint"
        crawlers:
          type: array
          maxItems: 20
          description: Every crawler a scan records, those that feed answers today first.
          items:
            $ref: "#/components/schemas/TribeltCrawler"
        keepingOut:
          type: array
          maxItems: 10000
          description: The competitors that keep crawlers out, most crawlers first.
          items:
            $ref: "#/components/schemas/KeepingOut"
        ranking:
          type: array
          maxItems: 20
          description: Tribelt among the best-prepared competitors, highest score first.
          items:
            $ref: "#/components/schemas/ReadinessRank"
        sites:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many sites have a recorded AI readiness.
          example: 41
        questions:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many buyer questions the newest run asked; 0 before any run.
          example: 20
        providers:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: How many providers the newest run asked; 0 before any run.
          example: 5
    PlanImprovement:
      description: One improvement of the plan.
      type: object
      additionalProperties: false
      required: [id, title, moves, measure, auto, done, why, steps, doneWhen, parts]
      properties:
        id:
          type: string
          maxLength: 60
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: Its id.
          example: llms-files
        title:
          type: string
          maxLength: 200
          description: What to do.
          example: Add llms.txt and llms-full.txt
        moves:
          type: string
          maxLength: 200
          description: What it moves, in words.
          example: AI readiness
        measure:
          $ref: "#/components/schemas/StandingMeasure"
        auto:
          type: boolean
          description: Whether the latest scan of tribelt.nl decides that it is done.
          example: true
        done:
          type: boolean
          description: Whether it is done.
          example: false
        tickedBy:
          type: string
          maxLength: 200
          description: Who ticked it off; only for one ticked by hand.
          example: joris
        tickedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When.
          example: "2026-11-02T09:00:00Z"
        why:
          type: string
          maxLength: 500
          description: Why it matters.
          example: llms.txt gives AI tools a short map of the site in plain text.
        steps:
          type: array
          maxItems: 10
          description: How to do it, step by step.
          items:
            type: string
            maxLength: 300
            example: Publish both at the root of tribelt.nl, next to robots.txt.
        doneWhen:
          type: string
          maxLength: 300
          description: When it counts as done.
          example: tribelt.nl/llms.txt and tribelt.nl/llms-full.txt both open.
        parts:
          type: array
          maxItems: 10
          description: >-
            What the latest scan of tribelt.nl found of an improvement a scan checks; empty for one
            ticked by hand, or before any scan.
          items:
            $ref: "#/components/schemas/PlanPart"
        tribelt:
          type: number
          format: double
          minimum: 0
          description: Tribelt's value on the measure it moves; absent without data.
          example: 2.5
        leader:
          $ref: "#/components/schemas/MeasureLeader"
    PlanPart:
      description: One thing a scan check looks for on tribelt.nl, and whether the latest scan found it.
      type: object
      additionalProperties: false
      required: [name, present]
      properties:
        name:
          type: string
          maxLength: 100
          description: What it looks for.
          example: llms-full.txt
        present:
          type: boolean
          description: Whether the latest scan found it.
          example: false
    PlanTarget:
      description: >-
        A number to watch - aiShareOfVoice and twenteShareOfVoice (shares of answers naming
        Tribelt), readinessChecks (out of five), termsUsed (map terms on tribelt.nl) or citations
        (web answers of a run citing tribelt.nl).
      type: string
      enum: [aiShareOfVoice, twenteShareOfVoice, readinessChecks, termsUsed, citations]
    WatchedNumber:
      description: A number to watch, now and its target.
      type: object
      additionalProperties: false
      required: [target, goal]
      properties:
        target:
          $ref: "#/components/schemas/PlanTarget"
        now:
          type: number
          format: double
          minimum: 0
          description: Its value now; absent without data.
          example: 0.24
        goal:
          type: number
          format: double
          minimum: 0
          description: Its target.
          example: 0.4
    EyeOnReason:
      description: Why to watch a competitor - mostNamed in AI answers, bestPrepared site, or strongest in twente.
      type: string
      enum: [mostNamed, bestPrepared, twente]
    EyeOn:
      description: A competitor to keep an eye on.
      type: object
      additionalProperties: false
      required: [why, leader]
      properties:
        why:
          $ref: "#/components/schemas/EyeOnReason"
        leader:
          $ref: "#/components/schemas/MeasureLeader"
    Plan:
      description: The plan as it stands.
      type: object
      additionalProperties: false
      required: [catalogueVersion, improvements, watched, eyeOn]
      properties:
        catalogueVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: The version of the improvements catalogue.
          example: 1
        improvements:
          type: array
          maxItems: 50
          description: The improvements, in order.
          items:
            $ref: "#/components/schemas/PlanImprovement"
        watched:
          type: array
          maxItems: 20
          description: The numbers to watch.
          items:
            $ref: "#/components/schemas/WatchedNumber"
        eyeOn:
          type: array
          maxItems: 10
          description: The competitors to keep an eye on.
          items:
            $ref: "#/components/schemas/EyeOn"
    ImprovementTick:
      description: Whether an improvement is done.
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done:
          type: boolean
          description: Done, or not done again.
          example: true
    PlanTargetValue:
      description: One target to set.
      type: object
      additionalProperties: false
      required: [target, value]
      properties:
        target:
          $ref: "#/components/schemas/PlanTarget"
        value:
          type: number
          format: double
          minimum: 0
          maximum: 10000
          description: Its new value.
          example: 40
    PlanTargetsChange:
      description: Targets to set.
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          maxItems: 10
          description: The targets.
          items:
            $ref: "#/components/schemas/PlanTargetValue"
    ProductSeller:
      description: A competitor that sells a family, with its own names for it.
      type: object
      additionalProperties: false
      required: [competitorId, name, names]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The competitor's name.
          example: Twentebelt
        websiteUrl:
          type: string
          format: uri
          maxLength: 500
          description: Its website.
          example: https://www.twentebelt.com/
        names:
          type: array
          maxItems: 100
          description: Its names for the family.
          items:
            type: string
            maxLength: 300
            example: Oogbanden
    ProductTerm:
      description: A term of the map for a family.
      type: object
      additionalProperties: false
      required: [term, language, tier, usedBy, usedByTribelt]
      properties:
        term:
          type: string
          maxLength: 300
          description: The term.
          example: draadogenband
        language:
          type: string
          maxLength: 10
          pattern: "^[a-z]{2}(-[A-Z]{2})?$"
          description: Its language.
          example: nl
        tier:
          $ref: "#/components/schemas/IntentTier"
        usedBy:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many companies use it.
          example: 9
        usedByTribelt:
          type: boolean
          description: Whether Tribelt's own site uses it.
          example: false
    ProductScope:
      description: How many of a family's answers in one scope name Tribelt.
      type: object
      additionalProperties: false
      required: [scope, answers, named]
      properties:
        scope:
          $ref: "#/components/schemas/PromptScope"
        answers:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The answers in the scope.
          example: 10
        named:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: Those naming Tribelt.
          example: 3
    ProductMention:
      description: A company a family's answers name, and the share of them that do.
      type: object
      additionalProperties: false
      required: [competitorId, name, role, share]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
        role:
          $ref: "#/components/schemas/CompanyRole"
        share:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: The share of the family's answers naming it.
          example: 0.6
    Product:
      description: One belt family against the field.
      type: object
      additionalProperties: false
      required: [family, tribeltNames, sellers, terms, termsUsed, answers, named, byScope, mostNamed]
      properties:
        family:
          $ref: "#/components/schemas/PromptFamily"
        tribeltNames:
          type: array
          maxItems: 100
          description: Tribelt's own names for it.
          items:
            type: string
            maxLength: 300
            example: Draadogenbanden
        sellers:
          type: array
          maxItems: 10000
          description: The competitors that sell it, by name.
          items:
            $ref: "#/components/schemas/ProductSeller"
        terms:
          type: array
          maxItems: 2000
          description: The map's terms for it, the most used first.
          items:
            $ref: "#/components/schemas/ProductTerm"
        termsUsed:
          type: integer
          format: int32
          minimum: 0
          maximum: 2000
          description: How many of the terms Tribelt's site uses.
          example: 4
        answers:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The newest run's answers about it; 0 before any run.
          example: 40
        named:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: Those naming Tribelt.
          example: 12
        byScope:
          type: array
          maxItems: 10
          description: The answers per scope.
          items:
            $ref: "#/components/schemas/ProductScope"
        mostNamed:
          type: array
          maxItems: 10
          description: The companies its answers name most.
          items:
            $ref: "#/components/schemas/ProductMention"
    ProductFinding:
      description: >-
        What stands out - crowded (the family the most competitors sell), fewestTerms (whose
        terms Tribelt uses least) or bestInAI (whose answers name Tribelt most).
      type: string
      enum: [crowded, fewestTerms, bestInAI]
    ProductStandout:
      description: A finding and the family it is about.
      type: object
      additionalProperties: false
      required: [finding, family]
      properties:
        finding:
          $ref: "#/components/schemas/ProductFinding"
        family:
          $ref: "#/components/schemas/PromptFamily"
    ProductsOverview:
      description: Tribelt's belt families against the field.
      type: object
      additionalProperties: false
      required: [items, standouts]
      properties:
        items:
          type: array
          maxItems: 10
          description: Every family, in order.
          items:
            $ref: "#/components/schemas/Product"
        standouts:
          type: array
          maxItems: 10
          description: What stands out among them.
          items:
            $ref: "#/components/schemas/ProductStandout"
    StandingMeasure:
      description: >-
        A measure Tribelt is compared on; higher is better on every one. aiShareOfVoice is the
        share of answers naming the company, citationShare the share of web answers citing its
        site, readinessChecks the AI readiness checks its site passes out of five (half for
        crawlers when some are kept out), sitemapPages the addresses its sitemaps list, and
        termsUsed the map terms its newest scan found.
      type: string
      enum: [aiShareOfVoice, citationShare, readinessChecks, sitemapPages, termsUsed]
      example: aiShareOfVoice
    MeasureLeader:
      description: The competitor with the best value on a measure.
      type: object
      additionalProperties: false
      required: [competitorId, name, value]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The competitor's name.
          example: Ashworth
        value:
          type: number
          format: double
          minimum: 0
          description: Its value.
          example: 0.57
    Standing:
      description: Tribelt against its competitors on one measure.
      type: object
      additionalProperties: false
      required: [measure, competitors, trails, leads]
      properties:
        measure:
          $ref: "#/components/schemas/StandingMeasure"
        tribelt:
          type: number
          format: double
          minimum: 0
          description: Tribelt's value; absent without data.
          example: 0.24
        median:
          type: number
          format: double
          minimum: 0
          description: The median over the competitors with data, the typical competitor; absent when none has data.
          example: 0.17
        leader:
          $ref: "#/components/schemas/MeasureLeader"
        competitors:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many competitors have data on the measure.
          example: 38
        trails:
          type: boolean
          description: Whether the leader is ahead of Tribelt; false when either has no value.
          example: true
        leads:
          type: boolean
          description: Whether Tribelt is level with or ahead of the leader.
          example: false
    Standings:
      description: How Tribelt stands against its competitors now.
      type: object
      additionalProperties: false
      required: [measures, trailing, open]
      properties:
        measures:
          type: array
          maxItems: 20
          description: Every measure, in order.
          items:
            $ref: "#/components/schemas/Standing"
        trailing:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
          description: How many measures Tribelt trails the leader on.
          example: 4
        open:
          type: array
          maxItems: 10
          description: The first improvements of the plan not done yet, in order.
          items:
            $ref: "#/components/schemas/PlanImprovement"
        runStartedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the Prompt run the AI measures come from started; absent before any.
          example: "2026-11-02T06:00:00Z"
    Overview:
      description: The figures of the home page.
      type: object
      additionalProperties: false
      required: [terms, competitors, aiSearch]
      properties:
        terms:
          $ref: "#/components/schemas/OverviewTerms"
        competitors:
          $ref: "#/components/schemas/OverviewCompetitors"
        aiSearch:
          $ref: "#/components/schemas/OverviewAiSearch"
    OverviewTerms:
      description: The terminology map in figures.
      type: object
      additionalProperties: false
      required: [total, tribelt, languages]
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: How many terms the map holds.
          example: 387
        tribelt:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: How many of them Tribelt's own site uses.
          example: 30
        languages:
          type: array
          maxItems: 200
          description: >-
            Every language with a term, the most terms first; American English counts as
            English.
          items:
            $ref: "#/components/schemas/OverviewLanguage"
    OverviewLanguage:
      description: The terms of one language, and how many of them Tribelt's own site uses.
      type: object
      additionalProperties: false
      required: [language, terms, tribelt]
      properties:
        language:
          $ref: "#/components/schemas/Language"
        terms:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: How many terms are in this language.
          example: 120
        tribelt:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: How many of them Tribelt's own site uses.
          example: 12
    OverviewCompetitors:
      description: The competitors the desk research found, and which of Tribelt's belt families they offer.
      type: object
      additionalProperties: false
      required: [makers, families]
      properties:
        makers:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: >-
            How many competitors the desk research found; a company added later, a group
            company and the mirror do not count.
          example: 24
        families:
          type: array
          maxItems: 20
          description: Each of Tribelt's belt families, in order, with how many of those competitors offer it.
          items:
            $ref: "#/components/schemas/OverviewFamily"
    OverviewFamily:
      description: How many of the competitors the desk research found offer one of Tribelt's belt families.
      type: object
      additionalProperties: false
      required: [family, makers]
      properties:
        family:
          $ref: "#/components/schemas/PromptFamily"
        makers:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many of them offer it.
          example: 9
    OverviewAiSearch:
      description: >-
        The newest Prompt run with answers that count, in figures. Before any such run there are
        no answers and no companies.
      type: object
      additionalProperties: false
      required: [answers, companies]
      properties:
        answers:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: How many of the run's answers count.
          example: 1260
        companies:
          type: array
          maxItems: 10
          description: >-
            Tribelt and the four competitors named in the most answers, the most first; Tribelt
            is listed with no answers when none names it.
          items:
            $ref: "#/components/schemas/OverviewMention"
    OverviewMention:
      description: How many of the run's answers name one company.
      type: object
      additionalProperties: false
      required: [competitorId, name, role, answers]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The name the home page shows; Tribelt goes by Tribelt.
          example: Twentebelt
        role:
          $ref: "#/components/schemas/CompanyRole"
        answers:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: How many answers name it.
          example: 412
    AiReadinessBrief:
      description: A scan's AI readiness in brief.
      type: object
      additionalProperties: false
      required: [gaps, blockedBots]
      properties:
        gaps:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: How many recommendations the site does not follow.
          example: 3
        blockedBots:
          type: array
          maxItems: 20
          description: The crawlers robots.txt blocks.
          items:
            type: string
            maxLength: 40
            example: GPTBot
    AiReadinessRow:
      description: One company in the AI readiness table.
      type: object
      additionalProperties: false
      required: [competitorId, name, role]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
        role:
          $ref: "#/components/schemas/CompanyRole"
        scan:
          $ref: "#/components/schemas/AnalysisSummary"
        readiness:
          $ref: "#/components/schemas/AiReadiness"
    AiReadinessTable:
      description: Every company's AI readiness, Tribelt and the mirror first.
      type: object
      additionalProperties: false
      required: [items, check]
      properties:
        items:
          type: array
          maxItems: 10000
          description: The rows.
          items:
            $ref: "#/components/schemas/AiReadinessRow"
        check:
          $ref: "#/components/schemas/ReadinessCheckState"
    ReadinessCheckState:
      description: >-
        How far checking every scanned company's AI readiness again has come, or how the last check
        ended; all zero when none ran since the server started.
      type: object
      additionalProperties: false
      required: [running, checked, failed, total]
      properties:
        running:
          type: boolean
          description: Whether a check runs now.
          example: true
        checked:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many sites it has done, of total.
          example: 12
        failed:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many of those could not be read or recorded; they keep what their scan recorded.
          example: 1
        total:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many sites it checks.
          example: 40
    ReadinessChange:
      description: >-
        One field of AI readiness that differs between two scans: a crawler (bot:GPTBot), robots,
        sitemapDeclared, sitemapLanguages, llmsTxt, llmsFullTxt, markdown, organization, product,
        languages, cms, seoPlugin or botProtection, with both values as they read.
      type: object
      additionalProperties: false
      required: [field, from, to]
      properties:
        field:
          type: string
          maxLength: 60
          description: The field.
          example: bot:GPTBot
        from:
          type: string
          maxLength: 300
          description: Its value in the older scan.
          example: allowed
        to:
          type: string
          maxLength: 300
          description: Its value in the newer scan.
          example: blocked
    ReadinessFiles:
      description: The raw files a scan read its AI readiness from; empty when the site served none.
      type: object
      additionalProperties: false
      required: [robotsTxt, robotsTruncated, llmsTxt, llmsTruncated, llmsFullTxt, llmsFullTruncated]
      properties:
        robotsTxt:
          type: string
          maxLength: 100000
          description: robots.txt.
          example: "User-agent: GPTBot\nDisallow: /"
        robotsTruncated:
          type: boolean
          description: True when robots.txt was longer than 100 KB and is cut there.
        llmsTxt:
          type: string
          maxLength: 100000
          description: llms.txt.
          example: "# Tribelt"
        llmsTruncated:
          type: boolean
          description: True when llms.txt was cut at 100 KB.
        llmsFullTxt:
          type: string
          maxLength: 100000
          description: llms-full.txt.
          example: "# Tribelt, every page"
        llmsFullTruncated:
          type: boolean
          description: True when llms-full.txt was cut at 100 KB.
    PromptFamily:
      description: One of Tribelt's five belt families a prompt asks about.
      type: string
      enum: [eyelink, open_spiral, closed_spiral, tri_flex_turn_curve, other]
    PromptKind:
      description: The kind of question - for a supplier, for a belt for an application, or about a problem.
      type: string
      enum: [supplier, application, problem]
    PromptScope:
      description: >-
        Where and in which language a prompt asks - Twente, the Netherlands or Germany in that
        region's language, or Dutch, German or English with no region.
      type: string
      enum: [twente, netherlands, germany, dutch, german, english]
    PromptRetryRequest:
      description: >-
        What to ask again - every failed answer of the run when empty, or the one question of one
        provider and mode when all three are given.
      type: object
      additionalProperties: false
      properties:
        promptId:
          type: string
          maxLength: 80
          pattern: "^[a-z0-9_-]+$"
          description: The question's id.
          example: eyelink-application-twente
        provider:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9][a-z0-9-]*$"
          description: The provider whose model to ask.
          example: openai
        mode:
          $ref: "#/components/schemas/PromptMode"
    PromptRetry:
      description: A run asked again.
      type: object
      additionalProperties: false
      required: [run, tasks, estimatedCostUsd]
      properties:
        run:
          $ref: "#/components/schemas/PromptRun"
        tasks:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          description: How many answers it asks again.
          example: 7
        estimatedCostUsd:
          $ref: "#/components/schemas/Usd"
    PromptMode:
      description: How a prompt is asked - from the model's own knowledge, or with live web search.
      type: string
      enum: [knowledge, web]
    PromptRunStatus:
      description: >-
        Where a Prompt run is - running, done, stopped (the month's budget was reached; its
        answers are kept) or failed.
      type: string
      enum: [running, done, stopped, failed]
    PromptTrigger:
      description: What started a run - an administrator, or the schedule.
      type: string
      enum: [manual, schedule]
    Usd:
      description: An amount in US dollars.
      type: number
      format: double
      minimum: 0
      maximum: 1000000
      example: 2.75
    PromptModelChoice:
      description: The model a run asks for one provider, and the paid fallback of a free one.
      type: object
      additionalProperties: false
      required: [provider, model, free]
      properties:
        provider:
          type: string
          maxLength: 40
          description: The provider's OpenRouter id.
          example: google
        model:
          type: string
          maxLength: 200
          description: The provider's cheapest text model.
          example: google/gemma-4-26b-a4b-it:free
        free:
          type: boolean
          description: True when the model costs nothing.
        fallback:
          type: string
          maxLength: 200
          description: The cheapest paid model, which answers what the free one cannot finish.
          example: google/gemini-2.5-flash-lite
    PromptProviderProgress:
      description: One provider's part of a run.
      type: object
      additionalProperties: false
      required: [provider, answered, failed, costUsd, models]
      properties:
        provider:
          type: string
          maxLength: 40
          description: The provider.
          example: openai
        answered:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: Its answers so far.
          example: 120
        failed:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The prompts it gave no answer to.
          example: 2
        costUsd:
          $ref: "#/components/schemas/Usd"
        models:
          type: array
          maxItems: 2
          description: The models that answered; two when the free one handed over to the paid one.
          items:
            type: string
            maxLength: 200
            example: openai/gpt-oss-20b
    PromptCell:
      description: >-
        The answers of one provider, scope, belt family and mode that were read, and how many name
        and cite Tribelt.
      type: object
      additionalProperties: false
      required: [provider, scope, family, mode, answers, named, cited]
      properties:
        provider:
          type: string
          maxLength: 40
          description: The provider.
          example: openai
        scope:
          $ref: "#/components/schemas/PromptScope"
        family:
          $ref: "#/components/schemas/PromptFamily"
        mode:
          $ref: "#/components/schemas/PromptMode"
        answers:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The answers read.
          example: 3
        named:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: Those that name Tribelt.
          example: 1
        cited:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: Those that cite a Tribelt address.
          example: 0
    PromptRun:
      description: One Prompt run, with how far it got and what it cost.
      type: object
      additionalProperties: false
      required: [id, promptSetVersion, factSheetVersion, trigger, startedBy, startedAt, status, models, tasks, answered, failed, inputTokens, outputTokens, costUsd, byProvider, cells]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: The run's id.
          example: 5b0c1a9e-2d3f-4e5a-8b6c-7d8e9f0a1b2c
        promptSetVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The version of the prompt set it asked.
          example: 1
        factSheetVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The version of the fact sheet its answers were judged against.
          example: 1
        trigger:
          $ref: "#/components/schemas/PromptTrigger"
        startedBy:
          type: string
          maxLength: 200
          description: Who started it, or "schedule".
          example: joris
        startedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it started.
          example: "2026-11-01T06:00:00Z"
        finishedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it ended; absent while it runs.
          example: "2026-11-01T06:20:00Z"
        status:
          $ref: "#/components/schemas/PromptRunStatus"
        failure:
          type: string
          maxLength: 300
          description: Why it stopped or failed.
          example: The month's budget for Prompt runs was reached; the answers so far are kept.
        models:
          type: array
          maxItems: 20
          description: The model asked for each provider.
          items:
            $ref: "#/components/schemas/PromptModelChoice"
        tasks:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many answers it asks for.
          example: 1260
        answered:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: Its answers so far.
          example: 640
        failed:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The prompts a model gave no answer to.
          example: 3
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: The tokens its prompts and readings sent, extraction included.
          example: 412000
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: The tokens its answers and readings returned.
          example: 1200000
        costUsd:
          $ref: "#/components/schemas/Usd"
        byProvider:
          type: array
          maxItems: 20
          description: Each provider's part.
          items:
            $ref: "#/components/schemas/PromptProviderProgress"
        cells:
          type: array
          maxItems: 10000
          description: Its answers counted per provider, scope, belt family and mode.
          items:
            $ref: "#/components/schemas/PromptCell"
    PromptMention:
      description: How often the answers of the newest run with any name one company on the list.
      type: object
      additionalProperties: false
      required: [competitorId, name, role, answers, first, averagePosition]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
        role:
          $ref: "#/components/schemas/CompanyRole"
        answers:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The answers that name it.
          example: 412
        first:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The answers that name it first.
          example: 120
        averagePosition:
          type: number
          format: double
          minimum: 0
          maximum: 1000
          description: Its average place in the answers that name it, from 1.
          example: 1.8
    PromptWrongClaim:
      description: A claim about Tribelt an answer made that the fact sheet contradicts.
      type: object
      additionalProperties: false
      required: [answerId, runId, at, provider, model, promptId, mode, claim]
      properties:
        answerId:
          type: string
          format: uuid
          maxLength: 36
          description: The answer's id.
          example: 5b0c1a9e-2d3f-4e5a-8b6c-7d8e9f0a1b2c
        runId:
          type: string
          format: uuid
          maxLength: 36
          description: The run's id.
          example: 5b0c1a9e-2d3f-4e5a-8b6c-7d8e9f0a1b2c
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When the answer was given.
          example: "2026-11-01T06:10:00Z"
        provider:
          type: string
          maxLength: 40
          description: The provider.
          example: openai
        model:
          type: string
          maxLength: 200
          description: The model.
          example: openai/gpt-oss-20b
        promptId:
          type: string
          maxLength: 80
          description: The prompt's id.
          example: eyelink-supplier-twente
        mode:
          $ref: "#/components/schemas/PromptMode"
        correctness:
          $ref: "#/components/schemas/PromptCorrectness"
        claim:
          type: string
          maxLength: 500
          description: The claim, quoted.
          example: Tribelt is in Hengelo.
    PromptCorrectness:
      description: How what an answer says about Tribelt holds against the fact sheet.
      type: string
      enum: [correct, partly, wrong]
    PromptTestResults:
      description: The Prompt test's results.
      type: object
      additionalProperties: false
      required: [promptSetVersion, runs, mentions, wrongClaims]
      properties:
        promptSetVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The version of the prompt set runs ask now.
          example: 1
        runs:
          type: array
          maxItems: 24
          description: The latest runs, newest first.
          items:
            $ref: "#/components/schemas/PromptRun"
        mentions:
          type: array
          maxItems: 10000
          description: The companies the answers of the newest run with any name, most answers first.
          items:
            $ref: "#/components/schemas/PromptMention"
        wrongClaims:
          type: array
          maxItems: 1000
          description: The claims about Tribelt the answers got wrong, newest first.
          items:
            $ref: "#/components/schemas/PromptWrongClaim"
    PromptNamedCompany:
      description: A company an answer names, matched to the company list when it is on it.
      type: object
      additionalProperties: false
      required: [name, position]
      properties:
        name:
          type: string
          maxLength: 200
          description: The name, as the answer writes it.
          example: Twentebelt
        url:
          type: string
          maxLength: 500
          description: The address the answer gives for it.
          example: https://www.twentebelt.com
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        position:
          type: integer
          format: int32
          minimum: 1
          maximum: 30
          description: Its place in the answer.
          example: 1
    PromptExtraction:
      description: How the extractor read an answer; failed when it could not, after a retry.
      type: object
      additionalProperties: false
      required: [failed, companies, addresses, namesTribelt, citesTribelt, wrongClaims, costUsd]
      properties:
        failed:
          type: boolean
          description: True when the extractor could not read it.
        companies:
          type: array
          maxItems: 30
          description: The companies named, in order.
          items:
            $ref: "#/components/schemas/PromptNamedCompany"
        addresses:
          type: array
          maxItems: 200
          description: The addresses cited.
          items:
            type: string
            maxLength: 500
            example: https://www.tribelt.nl/
        namesTribelt:
          type: boolean
          description: True when it names Tribelt.
        citesTribelt:
          type: boolean
          description: True when it cites a Tribelt address.
        correctness:
          $ref: "#/components/schemas/PromptCorrectness"
        wrongClaims:
          type: array
          maxItems: 10
          description: Each claim about Tribelt the fact sheet contradicts, quoted.
          items:
            type: string
            maxLength: 500
            example: Tribelt is in Hengelo.
        costUsd:
          $ref: "#/components/schemas/Usd"
    PromptAnswer:
      description: One model's answer to one prompt, with how it was read.
      type: object
      additionalProperties: false
      required: [id, promptId, family, kind, scope, language, prompt, promptSetVersion, provider, model, mode, text, citations, at, costUsd, inputTokens, outputTokens]
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: The answer's id.
          example: 5b0c1a9e-2d3f-4e5a-8b6c-7d8e9f0a1b2c
        promptId:
          type: string
          maxLength: 80
          description: The prompt's id.
          example: eyelink-supplier-twente
        family:
          $ref: "#/components/schemas/PromptFamily"
        kind:
          $ref: "#/components/schemas/PromptKind"
        scope:
          $ref: "#/components/schemas/PromptScope"
        language:
          type: string
          maxLength: 2
          description: The prompt's language.
          example: nl
        prompt:
          type: string
          maxLength: 1000
          description: The prompt, as asked.
          example: Welke bedrijven leveren draadogenbanden in Twente?
        promptSetVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The version of the prompt set it answered.
          example: 1
        provider:
          type: string
          maxLength: 40
          description: The provider.
          example: openai
        model:
          type: string
          maxLength: 200
          description: The exact model that answered.
          example: openai/gpt-oss-20b
        mode:
          $ref: "#/components/schemas/PromptMode"
        text:
          type: string
          maxLength: 100000
          description: The answer, as a buyer would see it.
          example: Twentebelt in Enschede makes eyelink belts.
        citations:
          type: array
          maxItems: 100
          description: The sources web search cited.
          items:
            type: string
            maxLength: 500
            example: https://www.twentebelt.com/
        failure:
          type: string
          maxLength: 300
          description: Why the model gave no answer.
          example: The model is rate limited.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it answered.
          example: "2026-11-01T06:10:00Z"
        costUsd:
          $ref: "#/components/schemas/Usd"
        inputTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          description: The tokens asking and reading the answer read.
          example: 1840
        outputTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          description: The tokens asking and reading the answer wrote.
          example: 612
        extraction:
          $ref: "#/components/schemas/PromptExtraction"
    PromptAnswerList:
      description: A run's answers.
      type: object
      additionalProperties: false
      required: [run, items]
      properties:
        run:
          $ref: "#/components/schemas/PromptRun"
        items:
          type: array
          maxItems: 5000
          description: The answers, in the order they came.
          items:
            $ref: "#/components/schemas/PromptAnswer"
    PromptCadence:
      description: How often scheduled runs start - monthly, on the first at 06:00 UTC, or weekly, on Mondays.
      type: string
      enum: [monthly, weekly]
    PromptFactSheet:
      description: What is true about Tribelt, which answers about Tribelt are judged against.
      type: object
      additionalProperties: false
      required: [text, version]
      properties:
        text:
          type: string
          maxLength: 4000
          description: The fact sheet.
          example: Tribelt B.V. makes metal conveyor belts in Haaksbergen.
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: Its version; each change is a new one.
          example: 2
        updatedBy:
          type: string
          maxLength: 200
          description: Who last changed it.
          example: joris
        updatedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When.
          example: "2026-10-26T09:00:00Z"
    PromptQuestion:
      description: One prompt of the prompt set.
      type: object
      additionalProperties: false
      required: [id, family, kind, scope, language, text]
      properties:
        id:
          type: string
          maxLength: 80
          description: Its id.
          example: eyelink-supplier-twente
        family:
          $ref: "#/components/schemas/PromptFamily"
        kind:
          $ref: "#/components/schemas/PromptKind"
        scope:
          $ref: "#/components/schemas/PromptScope"
        language:
          type: string
          maxLength: 2
          description: Its language.
          example: nl
        text:
          type: string
          maxLength: 1000
          description: The question.
          example: Welke bedrijven leveren draadogenbanden in Twente?
    PromptSet:
      description: The fixed, versioned prompt set runs ask.
      type: object
      additionalProperties: false
      required: [version, prompts]
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: Its version.
          example: 1
        prompts:
          type: array
          maxItems: 1000
          description: The prompts.
          items:
            $ref: "#/components/schemas/PromptQuestion"
    PromptPriceBasis:
      description: >-
        Where the prices come from - run (the latest run's own costs), catalogue (OpenRouter's
        price list times typical tokens, before any run) or none (nothing to go by).
      type: string
      enum: [run, catalogue, none]
    PromptProviderPrice:
      description: What one provider's answers cost.
      type: object
      additionalProperties: false
      required: [provider, model, knowledgeUsd, webUsd, runUsd]
      properties:
        provider:
          type: string
          maxLength: 40
          description: The provider.
          example: openai
        model:
          type: string
          maxLength: 200
          description: The model it asks.
          example: openai/gpt-oss-20b
        fallback:
          type: string
          maxLength: 200
          description: The paid model asked when the free one cannot answer.
          example: google/gemini-2.5-flash-lite
        knowledgeUsd:
          $ref: "#/components/schemas/Usd"
        webUsd:
          $ref: "#/components/schemas/Usd"
        runUsd:
          $ref: "#/components/schemas/Usd"
    PromptPrices:
      description: What Prompt runs cost, per provider, per run and per month against the budget.
      type: object
      additionalProperties: false
      required: [basis, providers, readingUsd, runUsd, runsPerMonth, monthUsd, budgetUsd, overBudget]
      properties:
        basis:
          $ref: "#/components/schemas/PromptPriceBasis"
        providers:
          type: array
          maxItems: 20
          description: Per provider, one answer from its own knowledge, one with web search, and a run.
          items:
            $ref: "#/components/schemas/PromptProviderPrice"
        readingUsd:
          $ref: "#/components/schemas/Usd"
        runUsd:
          $ref: "#/components/schemas/Usd"
        runsPerMonth:
          type: number
          format: double
          minimum: 0
          maximum: 31
          description: How many scheduled runs the cadence starts in an average month.
          example: 4.33
        monthUsd:
          $ref: "#/components/schemas/Usd"
        budgetUsd:
          $ref: "#/components/schemas/Usd"
        overBudget:
          type: boolean
          description: Whether a month of runs would cost more than the budget.
          example: true
    PromptTestSettings:
      description: The Prompt test's settings.
      type: object
      additionalProperties: false
      required: [providers, monthlyBudgetUsd, spentThisMonthUsd, cadence, nextDueAt, factSheet, promptSet, extractorModel, models, keyWorks, prices]
      properties:
        credentialId:
          $ref: "#/components/schemas/LlmCredentialId"
        providers:
          type: array
          maxItems: 20
          description: The providers whose cheapest model runs ask, by OpenRouter id.
          items:
            type: string
            maxLength: 40
            example: openai
        monthlyBudgetUsd:
          $ref: "#/components/schemas/Usd"
        spentThisMonthUsd:
          $ref: "#/components/schemas/Usd"
        cadence:
          $ref: "#/components/schemas/PromptCadence"
        nextDueAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the next scheduled run starts.
          example: "2026-11-01T06:00:00Z"
        factSheet:
          $ref: "#/components/schemas/PromptFactSheet"
        promptSet:
          $ref: "#/components/schemas/PromptSet"
        extractorModel:
          type: string
          maxLength: 200
          description: >-
            The one model that reads every answer - Claude Haiku on an Anthropic key while one
            works, else the OpenRouter model fixed in this release.
          example: google/gemini-2.5-flash-lite
        models:
          type: array
          maxItems: 20
          description: The models the latest run asked, each provider's with its fallback; empty before any run.
          items:
            $ref: "#/components/schemas/PromptModelChoice"
        keyWorks:
          type: boolean
          description: Whether the chosen OpenRouter key can be read and used.
          example: true
        prices:
          $ref: "#/components/schemas/PromptPrices"
    PromptTestSettingsChange:
      description: The settings to change; at least one.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        credentialId:
          $ref: "#/components/schemas/LlmCredentialId"
        providers:
          type: array
          minItems: 1
          maxItems: 20
          description: The providers whose cheapest model runs ask.
          items:
            type: string
            maxLength: 40
            example: openai
        monthlyBudgetUsd:
          type: number
          format: double
          minimum: 0.01
          maximum: 1000
          description: The month's budget in dollars.
          example: 10
        cadence:
          $ref: "#/components/schemas/PromptCadence"
        factSheet:
          type: string
          minLength: 20
          maxLength: 4000
          description: The fact sheet.
          example: Tribelt B.V. makes metal conveyor belts in Haaksbergen.
    CompetitorCandidateId:
      description: A competitor candidate's id, made from its name.
      type: string
      minLength: 16
      maxLength: 16
      pattern: "^[0-9a-f]{16}$"
      example: 3a7bd3e2360a9f01
    CompetitorCandidateStatus:
      description: Where a competitor candidate is in the review.
      type: string
      enum: [pending, added, dismissed]
    CompetitorCandidateDecision:
      description: A decision on a competitor candidate, by an administrator or by Claude Haiku.
      type: object
      additionalProperties: false
      required: [status, by, at]
      properties:
        status:
          $ref: "#/components/schemas/CompetitorCandidateStatus"
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        by:
          type: string
          maxLength: 200
          description: Who decided.
          example: joris
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When.
          example: "2026-11-01T09:00:00Z"
    CompetitorCandidate:
      description: A company the answers name that is not on the company list.
      type: object
      additionalProperties: false
      required: [id, name, status, answers, providers, models, addresses, lastSeenAt]
      properties:
        id:
          $ref: "#/components/schemas/CompetitorCandidateId"
        name:
          type: string
          maxLength: 200
          description: How the answers spell it most often.
          example: Ashworth
        status:
          $ref: "#/components/schemas/CompetitorCandidateStatus"
        answers:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: How many answers name it.
          example: 37
        providers:
          type: array
          maxItems: 20
          description: The providers whose models named it.
          items:
            type: string
            maxLength: 40
            example: openai
        models:
          type: array
          maxItems: 50
          description: The exact models that named it.
          items:
            type: string
            maxLength: 200
            example: openai/gpt-oss-20b
        addresses:
          type: array
          maxItems: 50
          description: The addresses the answers gave for it.
          items:
            type: string
            maxLength: 500
            example: https://www.ashworth.com
        lastSeenAt:
          type: string
          format: date-time
          maxLength: 64
          description: When an answer last named it.
          example: "2026-11-01T06:10:00Z"
        decision:
          $ref: "#/components/schemas/CompetitorCandidateDecision"
        sites:
          type: array
          maxItems: 20
          description: The domains of its own websites the addresses point to, the most given first.
          items:
            type: string
            maxLength: 253
            example: ashworth.com
        website:
          type: string
          maxLength: 500
          description: The home page to add it with, on its first site; absent without one.
          example: https://www.ashworth.com/
        names:
          type: array
          maxItems: 1000
          description: Every name it goes by, the one it is listed under first.
          items:
            $ref: "#/components/schemas/CandidateName"
        check:
          $ref: "#/components/schemas/CandidateCheck"
    CandidateName:
      description: One name a competitor candidate goes by.
      type: object
      additionalProperties: false
      required: [id, name, answers, joined]
      properties:
        id:
          $ref: "#/components/schemas/CompetitorCandidateId"
        name:
          type: string
          maxLength: 200
          description: How the answers spell it most often.
          example: Ashworth Bros. Inc.
        answers:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: How many answers give this name.
          example: 2
        joined:
          description: >-
            How it joined - lead (the name the candidate is listed under), site (given with an
            address on the same website) or model (merged by Claude Haiku or a person).
          type: string
          enum: [lead, site, model]
    CandidateCheck:
      description: >-
        Claude Haiku's check of a candidate against Tribelt's target market. A sure one decides the
        candidate; an unsure one is a suggestion for a person.
      type: object
      additionalProperties: false
      required: [competitor, sure, reason, model, at]
      properties:
        competitor:
          type: boolean
          description: Whether it takes the company for a competitor of Tribelt.
          example: true
        sure:
          type: boolean
          description: Whether it was sure.
          example: true
        reason:
          type: string
          maxLength: 500
          description: Why, in one sentence; empty when it gave no answer for it.
          example: Makes stainless steel wire mesh conveyor belts for ovens.
        model:
          type: string
          maxLength: 200
          description: The model that checked it.
          example: "anthropic: claude-haiku-5-5"
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When.
          example: "2026-10-27T09:30:00Z"
    CandidateReviewState:
      description: >-
        Whether Claude Haiku is reviewing the candidates or checking the competitor list, and why
        its last run stopped short.
      type: object
      additionalProperties: false
      required: [running]
      properties:
        running:
          type: boolean
          description: Whether it is reviewing now.
          example: false
        problem:
          description: >-
            Why its last review stopped short - noKey (no Anthropic key is set up), budget (the
            month's language-model tokens are spent) or failed (the model or its provider failed).
            Absent when it went well.
          type: string
          enum: [noKey, budget, failed]
    CandidateDecisions:
      description: Add or dismiss several competitor candidates.
      type: object
      additionalProperties: false
      required: [action, ids]
      properties:
        action:
          type: string
          enum: [add, dismiss]
          description: Add each to the competitor list with its website, or dismiss it.
        ids:
          type: array
          minItems: 1
          maxItems: 10000
          description: The candidates.
          items:
            $ref: "#/components/schemas/CompetitorCandidateId"
    CandidateDecisionResults:
      description: What deciding on several candidates did to each.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10000
          description: One per candidate, in the order asked.
          items:
            $ref: "#/components/schemas/CandidateDecisionResult"
    CandidateDecisionResult:
      description: What deciding did to one candidate.
      type: object
      additionalProperties: false
      required: [id, outcome]
      properties:
        id:
          $ref: "#/components/schemas/CompetitorCandidateId"
        name:
          type: string
          maxLength: 200
          description: Its name; absent for one that is gone.
          example: Ashworth
        outcome:
          type: string
          enum: [done, skipped]
          description: Decided, or skipped with the reason.
        reason:
          type: string
          maxLength: 300
          description: Why it was skipped.
          example: The answers gave no website for it; add it on its own.
    CompetitorCandidateCounts:
      description: How many candidates have each status.
      type: object
      additionalProperties: false
      required: [pending, added, dismissed, unchecked]
      properties:
        unchecked:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Pending candidates Claude Haiku has not checked.
          example: 4
        pending:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Pending candidates.
          example: 12
        added:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Added ones.
          example: 2
        dismissed:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Dismissed ones.
          example: 5
    CompetitorCheck:
      description: >-
        Claude Haiku's check of a company on the competitor list against Tribelt's target market. A
        sure "not a competitor" archives the company unless an administrator kept it.
      type: object
      additionalProperties: false
      required: [competitorId, competitor, sure, reason, model, at]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        competitor:
          type: boolean
          description: Whether it takes the company for a competitor of Tribelt.
          example: false
        sure:
          type: boolean
          description: Whether it was sure.
          example: true
        reason:
          type: string
          maxLength: 500
          description: Why, in one sentence; empty when it gave no answer for it.
          example: Makes rubber belting for quarries.
        model:
          type: string
          maxLength: 200
          description: The model that checked it.
          example: "anthropic: claude-haiku-5-5"
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When.
          example: "2026-10-27T09:30:00Z"
    CompetitorCheckList:
      description: Claude Haiku's checks of the companies on the competitor list, and the state of its check.
      type: object
      additionalProperties: false
      required: [items, unchecked, review]
      properties:
        items:
          type: array
          maxItems: 10000
          description: The checks, one per company.
          items:
            $ref: "#/components/schemas/CompetitorCheck"
        unchecked:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many competitors on the list the next check takes.
          example: 12
        review:
          $ref: "#/components/schemas/CandidateReviewState"
    CompetitorCandidateList:
      description: The competitor candidates with one status, and Claude Haiku's review of them.
      type: object
      additionalProperties: false
      required: [items, counts, review]
      properties:
        review:
          $ref: "#/components/schemas/CandidateReviewState"
        items:
          type: array
          maxItems: 10000
          description: The candidates, most answers first.
          items:
            $ref: "#/components/schemas/CompetitorCandidate"
        counts:
          $ref: "#/components/schemas/CompetitorCandidateCounts"
    Problem:
      description: An RFC 9457 problem detail.
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          maxLength: 256
          description: A URI naming the problem type.
          example: about:blank
        title:
          type: string
          maxLength: 256
          description: A short summary of the problem type.
          example: Invalid request
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code.
          example: 422
        detail:
          type: string
          maxLength: 1024
          description: What went wrong in this occurrence.
          example: Only http and https addresses on a public host can be analysed.
