# One pipeline ending in
# "Pipeline Complete" (estate convention). ONE job: GitHub bills each job rounded up to a full
# minute, so checks are steps, not jobs. `task check` and `task e2e` are everything CI runs, so
# local and CI cannot drift. Steps after the first carry `if: ${{ !cancelled() }}`, so one failure
# still surfaces the others.
#
# This repo is private and Actions minutes are scarce: CI runs only on pull requests that touch the
# app's code, and by hand, never on the push to main that merges a checked pull request. Run
# `task check` and `task e2e` locally before pushing.
name: CI

on:
  pull_request:
    # A release PR changes only the changelog and the manifest: it needs no new run.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".release-please-manifest.json"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-complete:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Check
        run: mise exec -- task check

      - name: End-to-end with axe
        if: ${{ !cancelled() }}
        run: mise exec -- task e2e

      - name: Container image builds
        if: ${{ !cancelled() }}
        run: docker build --build-arg VERSION=ci -t findability-explorer:ci .
