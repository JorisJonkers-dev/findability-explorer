      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm:
    get:
      operationId: getLlmSettings
      summary: Get the language-model settings
      description: >-
        Returns every credential (never a secret), the model product matching uses now, the
        token budget, and the latest 50 changes and tests, newest first.
      tags: [admin]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/credentials:
    post:
      operationId: addLlmCredential
      summary: Add a language-model API key
      description: >-
        Checks the key with the provider (by listing its models) and stores it sealed. A key the
        provider refuses is not stored and answers 422 with the provider's reason. The key is
