openapi: 3.1.0
info:
  title: findability-explorer API
  version: 1.0.0
  description: >-
    The Findability Explorer: the terminology map of metal conveyor belts (who calls which belt
    what, in which language) and on-demand analyses of a website's keywords. The Go server (ogen)
    and the Vue client (@hey-api/openapi-ts) are both generated from this document. Change it
    first; `task gen` regenerates both sides and `task gen:check` fails when either is stale.
  contact:
    name: Joris Jonkers
    url: https://github.com/JorisJonkers-dev
  license:
    name: Proprietary
    url: https://github.com/JorisJonkers-dev/findability-explorer/blob/main/LICENSE
servers:
  - url: https://digital-strategy.jorisjonkers.dev
    description: Production. The SPA and the API share one origin.
    x-internal: false
security:
  - sessionCookie: []
tags:
  - name: account
    description: The signed-in account.
  - name: admin
    description: >-
      Settings only an administrator (auth-api's ROLE_ADMIN) may read or change: the language-model
      credentials and the model product matching uses.
  - name: terminology
    description: The terminology map, built from competitors' and Tribelt's own websites.
  - name: competitors
    description: >-
      The companies Tribelt competes with: the ones the desk research studied, and every one a user
      added or scanned since.
  - name: analyses
    description: On-demand keyword analyses of one website.
paths:
  /api/v1/terms:
    get:
      operationId: searchTerms
      summary: Search the terminology map
      description: >-
        Returns the terms that match the query and every filter, best match first, with the count
        of matching terms per language, tier and belt family. The query ignores case, accents and
        the difference between ß and ss, and matches the term and its users.
      tags: [terminology]
      parameters:
        - name: q
          in: query
          required: false
          description: Free text to look for in the term and its users.
          schema:
            type: string
            maxLength: 100
        - name: language
          in: query
          required: false
          description: Only terms in this language.
          schema:
            $ref: "#/components/schemas/Language"
        - name: tier
          in: query
          required: false
          description: Only terms of this intent tier.
          schema:
            $ref: "#/components/schemas/IntentTier"
        - name: family
          in: query
          required: false
          description: Only terms for this belt family.
          schema:
            $ref: "#/components/schemas/BeltFamily"
        - name: user
          in: query
          required: false
          description: Only terms used by a company whose name contains this text.
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: How many terms to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The matching terms and the facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermSearch"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/competitors:
    get:
      operationId: listCompetitors
      summary: List every known company
      description: >-
        Returns every company the research studied and every company added since, with its names
        for each belt family and how often its website was scanned.
      tags: [competitors]
      responses:
        "200":
          description: >-
            The companies: researched competitors by name, then added ones by name, then Tribelt's
            own group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addCompetitor
      summary: Add a company
      description: >-
        Administrators only. Adds a company by its name and website. A website whose host a known
        company already has is refused with 409, naming that company.
      tags: [competitors]
      requestBody:
        required: true
        description: The company to add.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCompetitor"
            example:
              name: Example Belts
              url: https://www.example-belts.com
      responses:
        "201":
          description: The added company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/competitors/{competitorId}:
    get:
      operationId: getCompetitor
      summary: Get one company with its scans
      description: Returns the company and its scans, newest first, each with its number.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
      responses:
        "200":
          description: The company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorDetail"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCompetitor
      summary: Change a company's name or website, or archive it
      description: >-
        Administrators only. Changes the name or website of a company, or archives or restores a
        researched one. A researched company keeps the research's record; the change is stored
        beside it. A website whose host another company has is refused with 409.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
      requestBody:
        required: true
        description: The fields to change.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorUpdate"
            example:
              name: Example Belts
              url: https://www.example-belts.com
      responses:
        "200":
          description: The company after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCompetitor
      summary: Remove a company
      description: >-
        Administrators only. An added company is deleted with every scan of it. A researched
        company is the desk research's record and is archived instead: it leaves the list and the
        re-scans, its scans stay, and updateCompetitor restores it. Refused with 409 while a scan
        of the company is queued or running.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
      responses:
        "204":
          description: Deleted or archived.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/competitors/{competitorId}/profile:
    get:
      operationId: getCompetitorProfile
      summary: Get a company's search terms from its latest finished scan
      description: >-
        Returns the search terms of the company's latest finished scan, grouped by Tribelt belt
        family, with broad and specification terms apart, and for each term the scan it first
        appeared in. A company without a finished scan has no scan and no groups.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorProfile"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/competitors/{competitorId}/scans/compare:
    get:
      operationId: compareScans
      summary: Compare two scans of a company
      description: >-
        Returns the search terms one finished scan of the company found and the other did not,
        and the ones whose score or page count moved beyond a threshold, per belt family. Without
        `from` and `to` it compares the latest two finished scans. 422 when the company has fewer
        than two finished scans or a scan named is not a finished scan of it.
      tags: [competitors]
      parameters:
        - $ref: "#/components/parameters/CompetitorIdPath"
        - name: from
          in: query
          required: false
          description: The older scan's id; default the second newest finished scan.
          schema:
            type: string
            format: uuid
            maxLength: 36
        - name: to
          in: query
          required: false
          description: The newer scan's id; default the newest finished scan.
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanComparison"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/rescans:
    post:
      operationId: startRescans
      summary: Re-scan companies
      description: >-
        Administrators only. Queues one scan for each named company with a website, or with
        `all`, for every company that is not archived, has a website and has data: the desk
        research studied it, or it was scanned before. A
        company whose scan is still queued or running is skipped, and so is one without a
        website. The scans run a few at a time, each site politely.
      tags: [admin]
      requestBody:
        required: true
        description: Which companies to scan again.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescanRequest"
            example:
              all: true
              maxPages: 60
      responses:
        "202":
          description: The queued scans and the skipped companies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescanBatch"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates:
    get:
      operationId: listTermCandidates
      summary: List the search terms scans found outside the map
      description: >-
        Administrators only. Every phrase a finished scan found that the terminology map did not
        hold, across companies, with its evidence and the classifier's suggestion; filtered by
        review status, most companies and highest score first.
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          description: Only candidates with this status.
          schema:
            $ref: "#/components/schemas/TermCandidateStatus"
      responses:
        "200":
          description: The candidates and how many have each status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCandidateList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates/{candidateId}/accept:
    post:
      operationId: acceptTermCandidate
      summary: Add a candidate to the terminology map
      description: >-
        Administrators only. Adds the term, as the admin wrote it, to the terminology map, where
        search, the facets and the next scans find it. 409 when the candidate was decided already
        or the map has the term in that language.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      requestBody:
        required: true
        description: The term as it joins the map.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermAcceptance"
            example:
              term: spiral freezer belt
              language: en
              family: tri_flex_turn_curve
              tier: application
              usedBy: [Twentebelt]
      responses:
        "200":
          description: The candidate, accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCandidate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates/{candidateId}/reject:
    post:
      operationId: rejectTermCandidate
      summary: Reject a candidate
      description: >-
        Administrators only. Marks the candidate rejected; it stays rejected until the decision is
        undone. 409 when it was decided already.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: The candidate, rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCandidate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/term-candidates/{candidateId}/decision:
    delete:
      operationId: undoTermDecision
      summary: Undo the decision on a candidate
      description: >-
        Administrators only. Puts the candidate back in the queue; an accepted term leaves the
        terminology map again. 409 when the candidate is pending.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          description: The candidate, pending again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCandidate"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/analyses:
    get:
      operationId: listAnalyses
      summary: List recent analyses
      description: Returns at most `limit` analyses, newest first, without their results.
      tags: [analyses]
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            How many analyses to return; up to 300, so a re-scan of every company can be followed
            in one list.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 300
            default: 20
      responses:
        "200":
          description: The analyses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisList"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: startAnalysis
      summary: Start an analysis of a website
      description: >-
        Administrators only. Queues a crawl of the site behind `url`: at most `maxPages` pages on
        the same site, product and application pages first, following robots.txt and the site's
        sitemaps and language versions. The analysis runs in the background; poll it until its
        status is done or failed. 409 while a scan of the same company is queued or running.
      tags: [analyses]
      requestBody:
        required: true
        description: The website to analyse.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAnalysis"
            example:
              url: https://www.twentebelt.com
              maxPages: 60
      responses:
        "202":
          description: The queued analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/analyses/{analysisId}:
    get:
      operationId: getAnalysis
      summary: Get one analysis with its results
      description: Returns the analysis, its progress, and every result found so far.
      tags: [analyses]
      parameters:
        - name: analysisId
          in: path
          required: true
          description: The analysis's id.
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Get the signed-in account
      description: >-
        Returns who is signed in and whether they may open the admin settings. A request without a
        live session gets 401; the web app then sends the browser to /auth/login.
      tags: [account]
      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm:
    get:
      operationId: getLlmSettings
      summary: Get the language-model settings
      description: >-
        Returns every credential (never a secret), the model product matching uses now, the
        token budget, and the latest 50 changes and tests, newest first.
      tags: [admin]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/credentials:
    post:
      operationId: addLlmCredential
      summary: Add a language-model API key
      description: >-
        Checks the key with the provider (by listing its models) and stores it sealed. A key the
        provider refuses is not stored and answers 422 with the provider's reason. The key is
        never returned.
      tags: [admin]
      requestBody:
        required: true
        description: The key to add.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLlmCredential"
            example:
              provider: openrouter
              label: Course budget key
              apiKey: sk-or-v1-0000
      responses:
        "201":
          description: The stored credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmCredential"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/credentials/{credentialId}:
    delete:
      operationId: deleteLlmCredential
      summary: Delete a stored API key
      description: >-
        Deletes a stored credential. When it was the active one, matching falls back to the Vault
        credential with the default model, or is off without one. The Vault credential cannot be
        deleted here (422).
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/credentials/{credentialId}/test:
    post:
      operationId: testLlmCredential
      summary: Test an API key
      description: >-
        Asks the provider whether it accepts the key (by listing its models) and records the
        outcome on the credential and in the events. A refused key is a 200 with ok false; an
        unreadable stored key answers 422.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmTest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/credentials/{credentialId}/models:
    get:
      operationId: listLlmModels
      summary: List the models an API key can use
      description: >-
        Asks the provider for its models with this key. 502 when the provider fails or refuses;
        422 when the stored key is unreadable.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: The models, by id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmModelList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/admin/llm/active:
    put:
      operationId: setActiveLlm
      summary: Choose the credential and model for product matching
      description: >-
        Makes product matching use this credential and model from the next analysis on. The
        credential must exist (404) and be readable (422).
      tags: [admin]
      requestBody:
        required: true
        description: The credential and model to use.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveLlm"
            example:
              credentialId: vault-anthropic
              model: claude-haiku-5-5
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmSettings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearActiveLlm
      summary: Turn product matching off
      description: Turns product matching off until a credential and model are chosen again.
      tags: [admin]
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmSettings"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    CompetitorIdPath:
      name: competitorId
      in: path
      required: true
      description: The company's id.
      schema:
        $ref: "#/components/schemas/CompetitorId"
    CandidateId:
      name: candidateId
      in: path
      required: true
      description: The candidate's id.
      schema:
        $ref: "#/components/schemas/TermCandidateId"
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The credential's id.
      schema:
        $ref: "#/components/schemas/LlmCredentialId"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fe_session
      description: >-
        The sealed id of a server-side session, set by /auth/callback after signing in with
        auth-api (HttpOnly, SameSite=Lax). Without a live session the API answers 401; admin
        operations answer 403 unless auth-api currently grants ROLE_ADMIN. On a local run DEV_USER
        (and DEV_ROLES) stand in for a session.
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Language:
      description: A language as the terminology map records it; en-US marks American usage.
      type: string
      enum: [de, en, en-US, nl, fr, pl, it, es, sv, da]
    IntentTier:
      description: The kind of search a term represents.
      type: string
      enum: [spec, product, application, problem, broad]
    BeltFamily:
      description: >-
        The Tribelt belt family a term names. `all` is a term for every family (a broad category),
        `spec_all` a material or specification word that applies to every family.
      type: string
      enum: [eyelink, open_spiral, closed_spiral, tri_flex_turn_curve, other, all, spec_all]
    Term:
      description: One name for a belt, material or specification, as a company uses it.
      type: object
      additionalProperties: false
      required: [term, language, family, tier, usedBy, source, origin]
      properties:
        origin:
          $ref: "#/components/schemas/TermOrigin"
        term:
          type: string
          maxLength: 200
          description: The term as written on the source page.
          example: Drahtösengliederband
        language:
          $ref: "#/components/schemas/Language"
        family:
          $ref: "#/components/schemas/BeltFamily"
        tier:
          $ref: "#/components/schemas/IntentTier"
        usedBy:
          type: array
          maxItems: 20
          description: The companies that use the term.
          items:
            type: string
            maxLength: 200
            example: Märtens
        source:
          type: string
          maxLength: 500
          description: The page the term was taken from.
          example: https://www.martens-belts.com/de/produkte/metallfoerderband
    FacetCount:
      description: How many matching terms have one value of a facet.
      type: object
      additionalProperties: false
      required: [value, count]
      properties:
        value:
          type: string
          maxLength: 32
          description: The facet value.
          example: de
        count:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: The number of matching terms with this value.
          example: 32
    Facets:
      description: Counts of the terms that match the query, per facet value, ignoring that facet's own filter.
      type: object
      additionalProperties: false
      required: [languages, tiers, families]
      properties:
        languages:
          type: array
          maxItems: 20
          description: Counts per language.
          items:
            $ref: "#/components/schemas/FacetCount"
        tiers:
          type: array
          maxItems: 20
          description: Counts per intent tier.
          items:
            $ref: "#/components/schemas/FacetCount"
        families:
          type: array
          maxItems: 20
          description: Counts per belt family.
          items:
            $ref: "#/components/schemas/FacetCount"
    TermSearch:
      description: A page of matching terms.
      type: object
      additionalProperties: false
      required: [items, total, facets]
      properties:
        items:
          type: array
          maxItems: 200
          description: The matching terms, best match first.
          items:
            $ref: "#/components/schemas/Term"
        total:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many terms match, before the limit.
          example: 14
        facets:
          $ref: "#/components/schemas/Facets"
    BeltName:
      description: A company's own name for a belt, and the Tribelt family it corresponds to.
      type: object
      additionalProperties: false
      required: [name, family]
      properties:
        name:
          type: string
          maxLength: 300
          description: The company's product name.
          example: TwenteFlex spiral belts
        family:
          $ref: "#/components/schemas/BeltFamily"
    CompetitorId:
      description: A company's id, made from its name.
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      example: twentebelt
    CompetitorSource:
      description: Where a company comes from - the desk research, or added by a user or a scan.
      type: string
      enum: [research, added]
    Competitor:
      description: A known company.
      type: object
      additionalProperties: false
      required: [id, source, name, country, website, languages, groupCompany, beltNames, homepageTitle, scans, archived]
      properties:
        archived:
          type: boolean
          description: >-
            True for a researched company an administrator archived: it is left out of the
            re-scans and the web app hides it.
        id:
          $ref: "#/components/schemas/CompetitorId"
        source:
          $ref: "#/components/schemas/CompetitorSource"
        websiteUrl:
          type: string
          format: uri
          maxLength: 500
          description: The website to visit and to scan; absent when the research found none.
          example: https://www.twentebelt.com
        host:
          type: string
          maxLength: 253
          description: The website's host without "www.", by which scans are matched to the company.
          example: twentebelt.com
        scans:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many scans of the company's website were started.
          example: 2
        lastScan:
          $ref: "#/components/schemas/AnalysisSummary"
        addedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the company was added; only for added companies.
          example: "2026-10-22T09:30:00Z"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
        country:
          type: string
          maxLength: 200
          description: Where the company is based.
          example: NL
        website:
          type: string
          maxLength: 500
          description: The company's website as the research noted it, or the added address.
          example: https://www.twentebelt.com
        languages:
          type: array
          maxItems: 20
          description: The languages its website is in.
          items:
            type: string
            maxLength: 16
            example: en
        groupCompany:
          type: boolean
          description: True for a company in Tribelt's own group, which is never a competitor.
        beltNames:
          type: array
          maxItems: 50
          description: The company's names for its belts.
          items:
            $ref: "#/components/schemas/BeltName"
        homepageTitle:
          type: string
          maxLength: 300
          description: The title of its home page, or "unverified" when it could not be read.
          example: Twentebelt | Metal conveyor belts
    NewCompetitor:
      description: A company to add.
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The company's name.
          example: Example Belts
        url:
          type: string
          format: uri
          minLength: 8
          maxLength: 500
          description: The company's website. Only http and https on a public host.
          example: https://www.example-belts.com
    CompetitorDetail:
      description: A company with its most recent scans.
      type: object
      additionalProperties: false
      required: [competitor, scans]
      properties:
        competitor:
          $ref: "#/components/schemas/Competitor"
        scans:
          type: array
          maxItems: 100
          description: The company's scans, newest first.
          items:
            $ref: "#/components/schemas/AnalysisSummary"
    CompetitorList:
      description: Every known company.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          description: The companies.
          items:
            $ref: "#/components/schemas/Competitor"
    NewAnalysis:
      description: A website to analyse.
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 8
          maxLength: 500
          description: The page to start from. Only http and https on a public host.
          example: https://www.twentebelt.com
        maxPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 60
          description: The most pages to fetch.
          example: 60
        companyName:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            The name to add the company under when no known company has this website's host.
            Without it, an unknown company is added under its host.
          example: Example Belts
    AnalysisStatus:
      description: Where an analysis is in its life.
      type: string
      enum: [queued, running, done, failed]
    MatchingStatus:
      description: >-
        What happened to the product matching by the language model: pending until the crawl
        ends, disabled when no model is configured, skipped when the budget is spent or the site
        gave no text, then done or failed.
      type: string
      enum: [pending, disabled, skipped, done, failed]
    AnalysisSummary:
      description: An analysis without its results.
      type: object
      additionalProperties: false
      required: [id, url, status, maxPages, pagesCrawled, createdAt]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        number:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: >-
            The scan's number among its company's scans, from 1 for the first; it never changes.
            Absent for an analysis without a company.
          example: 3
        matchingModel:
          type: string
          maxLength: 300
          description: The provider and model that matched the products, when a model was asked.
          example: "openrouter: anthropic/claude-haiku-5-5"
        id:
          type: string
          format: uuid
          maxLength: 36
          description: The analysis's id.
          example: 5b0c1a9e-2d3f-4e5a-8b6c-7d8e9f0a1b2c
        url:
          type: string
          maxLength: 500
          description: The page the crawl started from.
          example: https://www.twentebelt.com
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        failure:
          type: string
          maxLength: 500
          description: Why the analysis failed; only when status is failed.
          example: The site did not answer within 10 seconds.
        maxPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: The most pages the crawl fetches.
          example: 60
        pagesCrawled:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: How many pages were fetched so far.
          example: 7
        createdAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the analysis was queued.
          example: "2026-10-22T09:30:00Z"
        finishedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the analysis finished; only when status is done or failed.
          example: "2026-10-22T09:31:10Z"
    AnalysisList:
      description: Recent analyses, newest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          description: The analyses.
          items:
            $ref: "#/components/schemas/AnalysisSummary"
    CrawledPage:
      description: One page the crawl fetched, with the belt family it is about when that is clear.
      type: object
      additionalProperties: false
      required: [url, title, description, language, wordCount]
      properties:
        url:
          type: string
          maxLength: 2000
          description: The page's address.
          example: https://www.twentebelt.com/conveyor-belts/
        title:
          type: string
          maxLength: 500
          description: The page title.
          example: Conveyor belts - Twentebelt
        description:
          type: string
          maxLength: 1000
          description: The meta description.
          example: Metal conveyor belts for the food processing industry.
        language:
          type: string
          maxLength: 16
          description: The page's language, from its markup or guessed from its words.
          example: en
        wordCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          description: The number of words of visible text.
          example: 412
        family:
          $ref: "#/components/schemas/BeltFamily"
    Keyword:
      description: >-
        A phrase about metal belts that the site emphasises, scored by where and how often it
        appears. Phrases without a word of the belt vocabulary, phrases that only name the site
        itself, and menu or footer text are left out.
      type: object
      additionalProperties: false
      required: [phrase, language, score, pages, tier, inMap]
      properties:
        tier:
          $ref: "#/components/schemas/IntentTier"
        family:
          $ref: "#/components/schemas/BeltFamily"
        closestTerm:
          type: string
          maxLength: 200
          description: The terminology map term that shares the most specific words with the phrase.
          example: balanced weave belt
        inMap:
          type: boolean
          description: >-
            True when the phrase is one of the map's own terms. A phrase that is not is a search
            term the map, and Tribelt, may be missing.
        phrase:
          type: string
          maxLength: 200
          description: The phrase, in lower case.
          example: metal conveyor belts
        language:
          type: string
          maxLength: 16
          description: The language of the pages it appears on.
          example: en
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Higher is more prominent; a title counts more than body text.
          example: 42.5
        pages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: On how many pages the phrase appears.
          example: 6
    KnownTerm:
      description: A term from the terminology map that the site uses.
      type: object
      additionalProperties: false
      required: [term, language, family, tier, occurrences, usedByTribelt]
      properties:
        term:
          type: string
          maxLength: 200
          description: The term as the map records it.
          example: balanced weave belt
        usedByTribelt:
          type: boolean
          description: >-
            True when Tribelt's own website uses the term too. A term the site uses and Tribelt
            does not is a search Tribelt is missing.
        language:
          $ref: "#/components/schemas/Language"
        family:
          $ref: "#/components/schemas/BeltFamily"
        tier:
          $ref: "#/components/schemas/IntentTier"
        occurrences:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000000
          description: How often the term appears across the crawled pages.
          example: 9
    SearchTerm:
      description: A term people may search with, in one language.
      type: object
      additionalProperties: false
      required: [term, language]
      properties:
        term:
          type: string
          maxLength: 200
          description: The search term.
          example: spiral belt
        language:
          type: string
          maxLength: 16
          description: Its language.
          example: en
    Equivalent:
      description: A product on the site matched to a Tribelt belt family by the language model.
      type: object
      additionalProperties: false
      required: [product, family, reason, searchTerms]
      properties:
        product:
          type: string
          maxLength: 300
          description: The site's own name for the product.
          example: TwenteFlex spiral belts
        family:
          $ref: "#/components/schemas/BeltFamily"
        reason:
          type: string
          maxLength: 1000
          description: Why the model judged the product equivalent.
          example: A curve-going spiral-tower belt, like Tri-Flex.
        searchTerms:
          type: array
          maxItems: 30
          description: The terms the site uses for the product, per language.
          items:
            $ref: "#/components/schemas/SearchTerm"
    Analysis:
      description: An analysis with its progress and results.
      type: object
      additionalProperties: false
      required: [summary, pages, keywords, knownTerms, matching, equivalents]
      properties:
        summary:
          $ref: "#/components/schemas/AnalysisSummary"
        pages:
          type: array
          maxItems: 100
          description: The pages fetched, in crawl order.
          items:
            $ref: "#/components/schemas/CrawledPage"
        keywords:
          type: array
          maxItems: 200
          description: The site's most prominent phrases, highest score first.
          items:
            $ref: "#/components/schemas/Keyword"
        knownTerms:
          type: array
          maxItems: 200
          description: Terms from the terminology map found on the site, most frequent first.
          items:
            $ref: "#/components/schemas/KnownTerm"
        matching:
          $ref: "#/components/schemas/MatchingStatus"
        matchingModel:
          type: string
          maxLength: 300
          description: >-
            The provider and model that matched the products, when a model was asked.
          example: "openrouter: anthropic/claude-haiku-5-5"
        equivalents:
          type: array
          maxItems: 50
          description: The site's products matched to Tribelt's belt families.
          items:
            $ref: "#/components/schemas/Equivalent"
    Me:
      description: The signed-in account.
      type: object
      additionalProperties: false
      required: [subject, name, isAdmin]
      properties:
        subject:
          type: string
          maxLength: 200
          description: The account's subject at auth-api.
          example: 3f2a9c4e-7d1b-4c6a-9e8f-1a2b3c4d5e6f
        name:
          type: string
          maxLength: 200
          description: The name to greet the account with.
          example: joris
        email:
          type: string
          format: email
          maxLength: 320
          description: The account's email address, when auth-api shares it.
          example: joris@example.com
        isAdmin:
          type: boolean
          description: True when auth-api grants ROLE_ADMIN, which the admin settings need.
    LlmProvider:
      description: A language-model provider.
      type: string
      enum: [anthropic, openrouter, mistral]
    LlmCredentialId:
      description: >-
        A credential's id: a UUID for a stored key, or `vault-anthropic` for the key Vault
        delivers in ANTHROPIC_API_KEY.
      type: string
      minLength: 15
      maxLength: 36
      pattern: "^(vault-anthropic|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"
      example: vault-anthropic
    LlmCredentialSource:
      description: Where a credential comes from - added here and stored sealed, or delivered by Vault.
      type: string
      enum: [stored, vault]
    LlmTest:
      description: The outcome of asking the provider whether it accepts a key.
      type: object
      additionalProperties: false
      required: [ok, at, message]
      properties:
        ok:
          type: boolean
          description: True when the provider accepted the key.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When the key was tested.
          example: "2026-10-23T09:30:00Z"
        message:
          type: string
          maxLength: 500
          description: What the provider said, or how many models the key may use.
          example: The key may use 312 models.
    LlmCredential:
      description: A language-model API key, shown without its secret.
      type: object
      additionalProperties: false
      required: [id, provider, label, source, fingerprint, readable]
      properties:
        id:
          $ref: "#/components/schemas/LlmCredentialId"
        provider:
          $ref: "#/components/schemas/LlmProvider"
        label:
          type: string
          maxLength: 100
          description: A name to tell keys apart.
          example: Course budget key
        source:
          $ref: "#/components/schemas/LlmCredentialSource"
        fingerprint:
          type: string
          minLength: 12
          maxLength: 12
          pattern: "^[0-9a-f]{12}$"
          description: >-
            The first 12 hex characters of the key's SHA-256: enough to tell keys apart, never
            enough to recover one.
          example: 3a7bd3e2360a
        readable:
          type: boolean
          description: >-
            False when the key was sealed under another SESSION_KEY and has to be entered again.
        createdBy:
          type: string
          maxLength: 200
          description: Who added the key; absent for the Vault key.
          example: joris
        createdAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the key was added; absent for the Vault key.
          example: "2026-10-23T09:30:00Z"
        lastTest:
          $ref: "#/components/schemas/LlmTest"
    NewLlmCredential:
      description: An API key to add.
      type: object
      additionalProperties: false
      required: [provider, label, apiKey]
      properties:
        provider:
          $ref: "#/components/schemas/LlmProvider"
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: A name to tell keys apart.
          example: Course budget key
        apiKey:
          type: string
          minLength: 8
          maxLength: 500
          description: The secret key. It is stored sealed and never returned.
          example: sk-or-v1-0000
    LlmModel:
      description: A model a key may use.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          maxLength: 200
          description: The provider's id for the model, which setActiveLlm takes.
          example: anthropic/claude-haiku-5-5
        name:
          type: string
          maxLength: 300
          description: The provider's display name for it, or the id.
          example: "Anthropic: Claude Haiku 5.5"
    LlmModelList:
      description: The models a key may use, by id.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 2000
          description: The models.
          items:
            $ref: "#/components/schemas/LlmModel"
    ActiveLlm:
      description: The credential and model product matching uses.
      type: object
      additionalProperties: false
      required: [credentialId, model]
      properties:
        credentialId:
          $ref: "#/components/schemas/LlmCredentialId"
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: The provider's id for the model.
          example: claude-haiku-5-5
    LlmChoice:
      description: >-
        How the active model was decided - `default` (nobody chose; the Vault key with
        claude-haiku-5-5 when Vault delivers one), `chosen` (an admin chose), or `off` (an admin
        turned matching off).
      type: string
      enum: [default, chosen, off]
    LlmEventAction:
      description: What an event records.
      type: string
      enum: [credential_added, credential_deleted, credential_tested, active_set, active_cleared]
    LlmEvent:
      description: One change to or test of the language-model settings.
      type: object
      additionalProperties: false
      required: [at, actor, action, message]
      properties:
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it happened.
          example: "2026-10-23T09:30:00Z"
        actor:
          type: string
          maxLength: 200
          description: Who did it.
          example: joris
        action:
          $ref: "#/components/schemas/LlmEventAction"
        credentialId:
          $ref: "#/components/schemas/LlmCredentialId"
        provider:
          $ref: "#/components/schemas/LlmProvider"
        model:
          type: string
          maxLength: 200
          description: The model, for active_set.
          example: claude-haiku-5-5
        ok:
          type: boolean
          description: For credential_tested and credential_added, whether the provider accepted the key.
        message:
          type: string
          maxLength: 500
          description: A sentence describing the event.
          example: Added openrouter key "Course budget key" (3a7bd3e2360a).
    LlmBudget:
      description: What analyses may spend on the language model.
      type: object
      additionalProperties: false
      required: [monthlyTokens, usedThisMonth, analysesPerHour, averageTokensPerScan, scansMatched]
      properties:
        monthlyTokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: The tokens all analyses of a calendar month (UTC) may use.
          example: 2000000
        usedThisMonth:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: The tokens analyses created this month used so far.
          example: 48211
        analysesPerHour:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many analyses one account may start per hour.
          example: 10
        averageTokensPerScan:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: >-
            The tokens one scan's product matching used on average, over every scan the language
            model answered for; 0 before the first.
          example: 29137
        scansMatched:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: How many scans the average is over.
          example: 2
    LlmSettings:
      description: The language-model settings.
      type: object
      additionalProperties: false
      required: [credentials, choice, matchingEnabled, budget, events]
      properties:
        credentials:
          type: array
          maxItems: 100
          description: Every credential, the Vault one first, then stored ones oldest first.
          items:
            $ref: "#/components/schemas/LlmCredential"
        choice:
          $ref: "#/components/schemas/LlmChoice"
        active:
          $ref: "#/components/schemas/ActiveLlm"
        matchingEnabled:
          type: boolean
          description: >-
            True when the next analysis will match products: a credential and model are active and
            the credential is readable.
        budget:
          $ref: "#/components/schemas/LlmBudget"
        events:
          type: array
          maxItems: 50
          description: The latest changes and tests, newest first.
          items:
            $ref: "#/components/schemas/LlmEvent"
    TermOrigin:
      description: >-
        Where a term comes from - the desk research of 22 October 2026, or a scan's phrase an
        administrator accepted from the review queue.
      type: string
      enum: [research, review]
    CompetitorUpdate:
      description: The fields of a company to change; at least one.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The company's new name.
          example: Example Belts
        url:
          type: string
          format: uri
          minLength: 8
          maxLength: 500
          description: The company's new website. Only http and https on a public host.
          example: https://www.example-belts.com
        archived:
          type: boolean
          description: True archives a researched company, false restores it.
    RescanRequest:
      description: >-
        Which companies to scan again - the ones named, or with `all` every company that is not
        archived, has a website and was scanned before. One of the two.
      type: object
      additionalProperties: false
      properties:
        competitorIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          description: The companies to scan again.
          items:
            $ref: "#/components/schemas/CompetitorId"
        all:
          type: boolean
          description: True scans every company with data again.
        maxPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 60
          description: The most pages each scan fetches.
          example: 60
    RescanSkip:
      description: A company a re-scan left out, and why.
      type: object
      additionalProperties: false
      required: [competitorId, name, reason]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
        reason:
          type: string
          maxLength: 300
          description: Why it was left out.
          example: A scan of it is still queued or running.
    RescanBatch:
      description: The scans a re-scan queued, and the companies it left out.
      type: object
      additionalProperties: false
      required: [queued, skipped]
      properties:
        queued:
          type: array
          maxItems: 200
          description: The queued scans, one per company.
          items:
            $ref: "#/components/schemas/AnalysisSummary"
        skipped:
          type: array
          maxItems: 200
          description: The companies left out.
          items:
            $ref: "#/components/schemas/RescanSkip"
    ProfileGroup:
      description: >-
        How a company's search terms are grouped - one of Tribelt's belt families, other metal
        belts, broad terms that name no family, or material and specification terms.
      type: string
      enum: [eyelink, open_spiral, closed_spiral, tri_flex_turn_curve, other, broad, spec]
    ProfileTerm:
      description: A search term of a company's latest finished scan.
      type: object
      additionalProperties: false
      required: [phrase, language, score, pages, tier, inMap, firstScan]
      properties:
        phrase:
          type: string
          maxLength: 200
          description: The phrase, in lower case.
          example: balanced weave belts
        language:
          type: string
          maxLength: 16
          description: The language of the pages it appears on.
          example: en
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Higher is more prominent.
          example: 42.5
        pages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: On how many pages it appears.
          example: 6
        tier:
          $ref: "#/components/schemas/IntentTier"
        family:
          $ref: "#/components/schemas/BeltFamily"
        closestTerm:
          type: string
          maxLength: 200
          description: The terminology map term closest to it.
          example: balanced weave belt
        inMap:
          type: boolean
          description: True when it is one of the map's own terms.
        firstScan:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: The number of the company's first finished scan that found it.
          example: 1
    ProfileGroupTerms:
      description: The search terms of one group, highest score first.
      type: object
      additionalProperties: false
      required: [group, terms]
      properties:
        group:
          $ref: "#/components/schemas/ProfileGroup"
        terms:
          type: array
          maxItems: 200
          description: The terms.
          items:
            $ref: "#/components/schemas/ProfileTerm"
    CompetitorProfile:
      description: >-
        A company's search terms from its latest finished scan, by group, every group present
        in a fixed order (Tribelt's families, other, broad, spec).
      type: object
      additionalProperties: false
      required: [competitorId, groups, languages, finishedScans]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        scan:
          $ref: "#/components/schemas/AnalysisSummary"
        finishedScans:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: How many of the company's scans finished.
          example: 2
        languages:
          type: array
          maxItems: 20
          description: The languages of the terms, most terms first.
          items:
            type: string
            maxLength: 16
            example: de
        groups:
          type: array
          maxItems: 7
          description: The terms by group; empty without a finished scan.
          items:
            $ref: "#/components/schemas/ProfileGroupTerms"
    TermChange:
      description: >-
        A search term one scan found and the other did not, or whose score or page count moved.
        The from fields are absent for an added term, the to fields for a removed one.
      type: object
      additionalProperties: false
      required: [phrase, language, tier, inMap]
      properties:
        phrase:
          type: string
          maxLength: 200
          description: The phrase, in lower case.
          example: spiral freezer belt
        language:
          type: string
          maxLength: 16
          description: Its language.
          example: en
        tier:
          $ref: "#/components/schemas/IntentTier"
        family:
          $ref: "#/components/schemas/BeltFamily"
        inMap:
          type: boolean
          description: True when it is one of the map's own terms.
        fromScore:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Its score in the older scan.
          example: 12
        toScore:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Its score in the newer scan.
          example: 30.5
        fromPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Its pages in the older scan.
          example: 2
        toPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Its pages in the newer scan.
          example: 5
    ComparisonGroup:
      description: What changed in one group between two scans.
      type: object
      additionalProperties: false
      required: [group, added, removed, moved]
      properties:
        group:
          $ref: "#/components/schemas/ProfileGroup"
        added:
          type: array
          maxItems: 200
          description: Terms only the newer scan found, highest score first.
          items:
            $ref: "#/components/schemas/TermChange"
        removed:
          type: array
          maxItems: 200
          description: Terms only the older scan found, highest score first.
          items:
            $ref: "#/components/schemas/TermChange"
        moved:
          type: array
          maxItems: 200
          description: Terms both found whose score or pages moved beyond the threshold, largest move first.
          items:
            $ref: "#/components/schemas/TermChange"
    ScanComparison:
      description: >-
        Two finished scans of a company compared, per group. A term moved when its score changed
        by at least a quarter and 5 points, or its page count by at least 2.
      type: object
      additionalProperties: false
      required: [from, to, groups]
      properties:
        from:
          $ref: "#/components/schemas/AnalysisSummary"
        to:
          $ref: "#/components/schemas/AnalysisSummary"
        groups:
          type: array
          maxItems: 7
          description: Every group, in the profile's order.
          items:
            $ref: "#/components/schemas/ComparisonGroup"
    TermCandidateId:
      description: A candidate's id, made from its phrase.
      type: string
      minLength: 16
      maxLength: 16
      pattern: "^[0-9a-f]{16}$"
      example: 3a7bd3e2360a9f01
    TermCandidateStatus:
      description: Where a candidate is in the review.
      type: string
      enum: [pending, accepted, rejected]
    CandidateCompany:
      description: A company whose scan found a candidate.
      type: object
      additionalProperties: false
      required: [competitorId, name]
      properties:
        competitorId:
          $ref: "#/components/schemas/CompetitorId"
        name:
          type: string
          maxLength: 200
          description: The company's name.
          example: Twentebelt
    TermDecision:
      description: An administrator's decision on a candidate.
      type: object
      additionalProperties: false
      required: [status, by, at]
      properties:
        status:
          $ref: "#/components/schemas/TermCandidateStatus"
        by:
          type: string
          maxLength: 200
          description: Who decided.
          example: joris
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When.
          example: "2026-10-23T09:30:00Z"
        term:
          $ref: "#/components/schemas/Term"
    TermCandidate:
      description: >-
        A phrase finished scans found that the terminology map did not hold, with its evidence
        across companies and the classifier's suggestion.
      type: object
      additionalProperties: false
      required: [id, phrase, status, languages, companies, scans, bestScore, maxPages, suggestedTier, lastSeenAt]
      properties:
        id:
          $ref: "#/components/schemas/TermCandidateId"
        phrase:
          type: string
          maxLength: 200
          description: The phrase, in lower case.
          example: spiral freezer belt
        status:
          $ref: "#/components/schemas/TermCandidateStatus"
        languages:
          type: array
          maxItems: 20
          description: The languages of the pages it was found on, most often first.
          items:
            type: string
            maxLength: 16
            example: en
        companies:
          type: array
          maxItems: 200
          description: The companies whose scans found it, by name.
          items:
            $ref: "#/components/schemas/CandidateCompany"
        scans:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: How many finished scans found it.
          example: 3
        bestScore:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Its highest score in one scan.
          example: 42.5
        maxPages:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: The most pages of one scan it appeared on.
          example: 6
        suggestedTier:
          $ref: "#/components/schemas/IntentTier"
        suggestedFamily:
          $ref: "#/components/schemas/BeltFamily"
        closestTerm:
          type: string
          maxLength: 200
          description: The map term the classifier found closest.
          example: spiral belt
        lastSeenAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the newest scan that found it was started.
          example: "2026-10-23T09:30:00Z"
        decision:
          $ref: "#/components/schemas/TermDecision"
    TermCandidateCounts:
      description: How many candidates have each status.
      type: object
      additionalProperties: false
      required: [pending, accepted, rejected]
      properties:
        pending:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Pending candidates.
          example: 41
        accepted:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Accepted candidates.
          example: 3
        rejected:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Rejected candidates.
          example: 7
    TermCandidateList:
      description: The candidates with one status.
      type: object
      additionalProperties: false
      required: [items, counts]
      properties:
        items:
          type: array
          maxItems: 1000
          description: The candidates, most companies and highest score first.
          items:
            $ref: "#/components/schemas/TermCandidate"
        counts:
          $ref: "#/components/schemas/TermCandidateCounts"
    TermAcceptance:
      description: A candidate as it joins the terminology map.
      type: object
      additionalProperties: false
      required: [term, language, family, tier, usedBy]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 200
          description: The term as the map shows it.
          example: spiral freezer belt
        language:
          $ref: "#/components/schemas/Language"
        family:
          $ref: "#/components/schemas/BeltFamily"
        tier:
          $ref: "#/components/schemas/IntentTier"
        usedBy:
          type: array
          maxItems: 20
          description: The companies that use it.
          items:
            type: string
            minLength: 1
            maxLength: 200
            example: Twentebelt
    Problem:
      description: An RFC 9457 problem detail.
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          maxLength: 256
          description: A URI naming the problem type.
          example: about:blank
        title:
          type: string
          maxLength: 256
          description: A short summary of the problem type.
          example: Invalid request
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code.
          example: 422
        detail:
          type: string
          maxLength: 1024
          description: What went wrong in this occurrence.
          example: Only http and https addresses on a public host can be analysed.
